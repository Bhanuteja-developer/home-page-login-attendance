  <p class="font-body-md text-body-md text-on-surface-variant">Enter the 6-digit code sent to your email and create your new password.</p>
</div><div class="space-y-sm">

<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // OTP Input Logic
            const otpInputs = document.querySelectorAll('#otp-container input');
            
            otpInputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Restrict to single digit
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    
                    // Auto-advance
                    if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                        otpInputs[index + 1].disabled = false;
                        otpInputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    // Auto-backspace
                    if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                        otpInputs[index - 1].focus();
                        otpInputs[index].disabled = true;
                    }
                });
            });

            // Password Visibility Toggle Logic
            const toggleButtons = document.querySelectorAll('.toggle-password');
            
            toggleButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const input = this.previousElementSibling;
                    const iconSpan = this.querySelector('.material-symbols-outlined');
                    
                    if (input.type === 'password') {
                        input.type = 'text';
                        iconSpan.textContent = 'visibility_off';
                    } else {
                        input.type = 'password';
                        iconSpan.textContent = 'visibility';
                    }
                });
            });
        });
    </script>
