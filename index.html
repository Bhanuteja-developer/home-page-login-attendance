<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedometer Financial Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111111; /* Very dark background to make the cards pop */
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
        }

        .gauge-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }

        /* Spring-like easing for the mechanical needle sweep */
        .needle-anim {
            transition: transform 2.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glow-track {
            transition: stroke-dashoffset 2.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Staggered fade up for cards */
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUpAnim 0.8s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-300 { animation-delay: 300ms; }

        @keyframes fadeUpAnim {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Odometer-style text styling */
        .odometer-text {
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <main class="w-full max-w-[500px] rounded-3xl shadow-2xl overflow-hidden fade-up relative bg-[#222224] border border-gray-800 p-3 sm:p-5">
        
        <!-- Header -->
        <div class="pt-2 pb-4 text-center">
            <h2 class="text-base sm:text-lg font-bold text-white tracking-wide">Financial Dashboard</h2>
        </div>

        <!-- Two Gauges Container (Side-by-Side for Mobile) -->
        <div class="flex flex-row gap-2 sm:gap-4 w-full">
            
            <!-- Gauge 1: Overview -->
            <div id="gauge-overview" class="flex-1 bg-black/20 rounded-2xl p-2.5 sm:p-4 border border-gray-800/60 flex flex-col items-center">
                <h3 class="text-[10px] sm:text-xs text-gray-400 font-bold uppercase tracking-widest mb-2 text-center">Overview</h3>
                
                <div class="relative w-full max-w-[140px] aspect-square flex items-center justify-center mx-auto">
                    <svg viewBox="0 0 200 170" class="w-full h-auto drop-shadow-xl">
                        <defs>
                            <linearGradient id="gaugeGradient1" x1="0%" y1="100%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#893b96" />
                                <stop offset="50%" stop-color="#6965d1" />
                                <stop offset="100%" stop-color="#498df5" />
                            </linearGradient>
                        </defs>
                        <!-- Background Track -->
                        <path d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57" fill="none" stroke="#2a2a2c" stroke-width="12" stroke-linecap="butt"/>
                        <!-- Dynamic Ticks Group -->
                        <g class="ticksGroup"></g>
                        <!-- Glowing Animated Track -->
                        <path class="glow-track glowTrack" 
                              d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57" 
                              fill="none" stroke="url(#gaugeGradient1)" stroke-width="12" stroke-linecap="butt" 
                              stroke-dasharray="377" stroke-dashoffset="377" />
                        <!-- Needle -->
                        <g class="needle-anim needle" style="transform-origin: 100px 100px; transform: rotate(135deg);">
                            <path d="M 155 100 L 100 92 A 8 8 0 0 0 100 108 Z" fill="#ffffff" />
                            <circle cx="100" cy="100" r="3.5" fill="#d1d5db" />
                        </g>
                    </svg>
                    
                    <!-- Percentage Bottom Center -->
                    <div class="absolute bottom-1 w-full text-center pointer-events-none">
                        <div class="text-xl sm:text-2xl font-bold text-white leading-none tracking-tight"><span class="percentageVal">0</span><span class="text-xs sm:text-sm text-gray-300 ml-0.5">%</span></div>
                    </div>
                </div>

                <!-- Stats Section -->
                <div class="w-full mt-4 space-y-2 border-t border-gray-700/50 pt-3">
                    <div class="flex justify-between items-center text-[9px] sm:text-[11px]">
                        <span class="text-gray-400 font-medium">Income</span>
                        <span class="text-white font-bold tracking-tight val-income">₹0</span>
                    </div>
                    <div class="flex justify-between items-center text-[9px] sm:text-[11px]">
                        <span class="text-gray-400 font-medium">Expenses</span>
                        <span class="text-white font-bold tracking-tight val-expenses">₹0</span>
                    </div>
                    <div class="flex justify-between items-center text-[9px] sm:text-[11px] pt-0.5">
                        <span class="text-[#498df5] font-semibold">Left Amt</span>
                        <span class="text-[#498df5] font-bold tracking-tight val-left">₹0</span>
                    </div>
                </div>
            </div>

            <!-- Gauge 2: Budget Planning -->
            <div id="gauge-budget" class="flex-1 bg-black/20 rounded-2xl p-2.5 sm:p-4 border border-gray-800/60 flex flex-col items-center">
                <h3 class="text-[10px] sm:text-xs text-gray-400 font-bold uppercase tracking-widest mb-2 text-center">Budget Plan</h3>
                
                <div class="relative w-full max-w-[140px] aspect-square flex items-center justify-center mx-auto">
                    <svg viewBox="0 0 200 170" class="w-full h-auto drop-shadow-xl">
                        <defs>
                            <linearGradient id="gaugeGradient2" x1="0%" y1="100%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#893b96" />
                                <stop offset="50%" stop-color="#6965d1" />
                                <stop offset="100%" stop-color="#498df5" />
                            </linearGradient>
                        </defs>
                        <!-- Background Track -->
                        <path d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57" fill="none" stroke="#2a2a2c" stroke-width="12" stroke-linecap="butt"/>
                        <!-- Dynamic Ticks Group -->
                        <g class="ticksGroup"></g>
                        <!-- Glowing Animated Track -->
                        <path class="glow-track glowTrack" 
                              d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57" 
                              fill="none" stroke="url(#gaugeGradient2)" stroke-width="12" stroke-linecap="butt" 
                              stroke-dasharray="377" stroke-dashoffset="377" />
                        <!-- Needle -->
                        <g class="needle-anim needle" style="transform-origin: 100px 100px; transform: rotate(135deg);">
                            <path d="M 155 100 L 100 92 A 8 8 0 0 0 100 108 Z" fill="#ffffff" />
                            <circle cx="100" cy="100" r="3.5" fill="#d1d5db" />
                        </g>
                    </svg>
                    
                    <!-- Percentage Bottom Center -->
                    <div class="absolute bottom-1 w-full text-center pointer-events-none">
                        <div class="text-xl sm:text-2xl font-bold text-white leading-none tracking-tight"><span class="percentageVal">0</span><span class="text-xs sm:text-sm text-gray-300 ml-0.5">%</span></div>
                    </div>
                </div>

                <!-- Stats Section -->
                <div class="w-full mt-4 space-y-2 border-t border-gray-700/50 pt-3">
                    <div class="flex justify-between items-center text-[9px] sm:text-[11px]">
                        <span class="text-gray-400 font-medium">Budget</span>
                        <span class="text-white font-bold tracking-tight val-budget">₹0</span>
                    </div>
                    <div class="flex justify-between items-center text-[9px] sm:text-[11px]">
                        <span class="text-gray-400 font-medium">Spent</span>
                        <span class="text-white font-bold tracking-tight val-spent">₹0</span>
                    </div>
                    <div class="flex justify-between items-center text-[9px] sm:text-[11px] pt-0.5">
                        <span class="text-[#498df5] font-semibold">Left</span>
                        <span class="text-[#498df5] font-bold tracking-tight val-left">₹0</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const formatCurrency = (value) => {
                return new Intl.NumberFormat('en-IN', {
                    style: 'currency',
                    currency: 'INR',
                    maximumFractionDigits: 0
                }).format(value);
            };

            const animateValue = (element, start, end, duration, isCurrency = true) => {
                if (!element) return;
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    
                    const easeOut = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                    const currentValue = Math.floor(easeOut * (end - start) + start);
                    
                    element.textContent = isCurrency ? formatCurrency(currentValue) : currentValue;

                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        element.textContent = isCurrency ? formatCurrency(end) : end;
                    }
                };
                window.requestAnimationFrame(step);
            };

            class SpeedometerGauge {
                constructor(containerId, percentage, statsValues) {
                    this.container = document.getElementById(containerId);
                    // Ensure percentage is capped logically between 0 and 100
                    this.percentage = Math.min(Math.max(percentage, 0), 100);
                    this.statsValues = statsValues;
                    
                    this.ticksGroup = this.container.querySelector('.ticksGroup');
                    this.needle = this.container.querySelector('.needle');
                    this.glowTrack = this.container.querySelector('.glowTrack');
                    this.elPercentage = this.container.querySelector('.percentageVal');
                    
                    this.init();
                }

                init() {
                    this.drawTicks();
                    this.animateStats();
                    // Slight delay before needle sweeps adds to the mechanical feel
                    setTimeout(() => this.animateGauge(), 300);
                }

                drawTicks() {
                    const cx = 100, cy = 100;
                    const startAngleDeg = 135, sweepAngleDeg = 270;
                    const majorTickInnerR = 64, majorTickOuterR = 70;
                    const minorTickInnerR = 66, minorTickOuterR = 70;
                    const textR = 52; 
                    
                    for (let i = 0; i <= 100; i += 2) {
                        const isLabelTick = i % 20 === 0;
                        const isMajorTick = i % 10 === 0;
                        
                        const angleDeg = startAngleDeg + (i / 100) * sweepAngleDeg;
                        const angleRad = angleDeg * (Math.PI / 180);
                        const cosA = Math.cos(angleRad), sinA = Math.sin(angleRad);
                        
                        if (i % 5 === 0) { 
                            const r1 = isMajorTick ? majorTickInnerR : minorTickInnerR;
                            const r2 = isMajorTick ? majorTickOuterR : minorTickOuterR;
                            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                            line.setAttribute("x1", cx + r1 * cosA);
                            line.setAttribute("y1", cy + r1 * sinA);
                            line.setAttribute("x2", cx + r2 * cosA);
                            line.setAttribute("y2", cy + r2 * sinA);
                            line.setAttribute("stroke", "#6b7280"); 
                            line.setAttribute("stroke-width", isMajorTick ? "1.5" : "1");
                            line.setAttribute("stroke-linecap", "round");
                            this.ticksGroup.appendChild(line);
                        }

                        if (isLabelTick) {
                            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                            text.setAttribute("x", cx + textR * cosA);
                            text.setAttribute("y", cy + textR * sinA);
                            text.setAttribute("dy", "3"); 
                            text.setAttribute("text-anchor", "middle");
                            text.setAttribute("fill", "#9ca3af");
                            text.setAttribute("font-size", "7.5");
                            text.setAttribute("font-family", "sans-serif");
                            text.textContent = i;
                            this.ticksGroup.appendChild(text);
                        }
                    }
                }

                animateGauge() {
                    const targetAngle = 135 + (270 * (this.percentage / 100));
                    this.needle.style.transform = `rotate(${targetAngle}deg)`;
                    
                    const totalTrackLength = 377;
                    const offset = totalTrackLength - (totalTrackLength * (this.percentage / 100));
                    this.glowTrack.style.strokeDashoffset = offset;

                    animateValue(this.elPercentage, 0, this.percentage, 2000, false);
                }

                animateStats() {
                    // Loop through stats dictionary and animate corresponding DOM element selectors
                    for (const [selector, value] of Object.entries(this.statsValues)) {
                        const el = this.container.querySelector(selector);
                        if (el) animateValue(el, 0, value, 1800);
                    }
                }
            }

            
            // 1. Overview Gauge Data (Income vs Expenses)
            const overviewExpPct = Math.round((8700 / 21000) * 100);
            new SpeedometerGauge('gauge-overview', overviewExpPct, {
                '.val-income': 21000,
                '.val-expenses': 8700,
                '.val-left': 12300
            });

            // 2. Budget Planning Gauge Data (Budget Limit vs Spent)
            const budgetSpentPct = Math.round((8700 / 13350) * 100);
            new SpeedometerGauge('gauge-budget', budgetSpentPct, {
                '.val-budget': 13350,
                '.val-spent': 8700,
                '.val-left': 4650
            });
            
        });
    </script>
</body>
</html>
