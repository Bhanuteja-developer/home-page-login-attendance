<!DOCTYPE html><html class="h-full" lang="en" style=""><head>

                        "on-error": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#213145",

                    },
                    "borderRadius": {

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        body {
            background: linear-gradient(135deg, #f8f9ff 0%, #e5eeff 50%, #d3e4fe 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="h-full flex items-center justify-center p-md font-body-md text-on-surface pt-lg bg-surface" style="min-height: max(884px, 100dvh); background: rgb(240, 253, 244);"><header class="fixed top-0 left-0 w-full bg-surface-container-lowest border-b border-outline-variant p-md flex flex-col items-center justify-center z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[24px]" data-icon="fingerprint">fingerprint</span>
<h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">WorkforceOS</h1>
</div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mt-xs">Secure Enterprise Access</p>
</header>
<div class="w-full max-w-md mt-lg">
<div class="glass-panel rounded-xl shadow-lg p-xl relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary"></div>
<form class="space-y-lg"><div class="mb-lg">
    <h2 class="font-headline-lg text-headline-sm text-primary tracking-widest uppercase">Login</h2>
    <div class="h-1 w-12 bg-primary mt-xs rounded-full"></div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface uppercase" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-xl pr-md py-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors sm:text-sm font-body-md text-body-md" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface uppercase" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-xl pr-md py-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors sm:text-sm font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-sm flex items-center text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-sm">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-sm block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">
                            Forgot Password?
                        </a>
</div>
</div>
<button class="w-full flex justify-center items-center py-md px-md border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 active:scale-[0.98] uppercase tracking-wider group" type="submit">
                    Login
                    <span class="material-symbols-outlined ml-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<div class="mt-lg pt-lg border-t border-outline-variant text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors ml-xs" href="#">Signup</a>
</p>
</div>
</div>
<div class="mt-lg text-center opacity-70">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">© 2024 WorkforceOS Inc.</p>
</div>
</div>
<script>
        document.querySelector('button[aria-label="Toggle password visibility"]').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('span');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    </script>




</body></html>
