<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS -->

  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for on-the-fly JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- SVG Icons to ensure zero external dependencies and robust rendering ---
    const Icons = {
      Mic: (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />

        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="red" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-pulse" {...props}>
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />

        </svg>
      ),
      Trash: (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      ),
      Plus: (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
          <path d="M5 12h14" />
          <path d="M12 5v14" />
        </svg>
      ),
      Clipboard: (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
          <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
        </svg>
      ),
      ArrowUp: (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...props}>
          <path d="m18 15-6-6-6 6"/>
        </svg>
      ),
      ArrowDown: (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...props}>
          <path d="m6 9 6 6 6-6"/>
        </svg>
      )
    };

    // Automating the details from the provided image
    const INITIAL_DATA = [
      {
        id: 'cat-1',
        title: '1. Kirana Items',
        items: [
          { id: '1-1', name: 'Poha', quantity: '15 kg' },
          { id: '1-2', name: 'Rava (Mota)', quantity: '20 kg' },
          { id: '1-3', name: 'Sugar', quantity: '30 kg' },
          { id: '1-4', name: 'Kaju (4 pieces)', quantity: '1 kg' },
          { id: '1-5', name: 'Badam', quantity: '1/2 kg' },
          { id: '1-6', name: 'Elachi', quantity: '200 g' },
          { id: '1-7', name: 'Water melon seeds', quantity: '250 g' },
          { id: '1-8', name: 'Kismiss', quantity: '1 kg' },
          { id: '1-9', name: 'Bheemseni karpoor', quantity: '1 small box' },
          { id: '1-10', name: 'Patika Bellam', quantity: '200 g' },
          { id: '1-11', name: 'Bellam (* Food - 1 kg * Sweat - 5 kg)', quantity: '6 kg' },
          { id: '1-12', name: 'Ghee (* Food - 1 kg * Sweat - 5 kg)', quantity: '6 kg' },
          { id: '1-13', name: 'Peasar papu', quantity: '12 kg' },
          { id: '1-14', name: 'Chinta pandu', quantity: '1 kg' },
          { id: '1-15', name: 'Dhaniya powder', quantity: '4 kg' },
          { id: '1-16', name: 'Palli', quantity: '3 kg' },
          { id: '1-17', name: 'Sambar Powder', quantity: '800 g' },
          { id: '1-18', name: 'Hing', quantity: '1 small box' },
          { id: '1-19', name: 'Minapapu', quantity: '1 kg' },
          { id: '1-20', name: 'Chenga papu', quantity: '1 kg' },
          { id: '1-21', name: 'Aavalu', quantity: '1/2 kg' },
          { id: '1-22', name: 'Jelakara', quantity: '1/2 kg' },
          { id: '1-23', name: 'Endu Mirchi', quantity: '250 g' },
          { id: '1-24', name: 'Oil', quantity: '2 Tin' },
          { id: '1-25', name: 'Garam masala', quantity: '100 g' },
          { id: '1-26', name: 'Sabji masala', quantity: '200 g' },
          { id: '1-27', name: 'Dodu salt', quantity: '4 kg' },
          { id: '1-28', name: 'Normal salt', quantity: "10 no's" },
          { id: '1-29', name: 'Mirchi powder (Low spice)', quantity: '2 kg' },
          { id: '1-30', name: 'Pasupu', quantity: '500 g' },
          { id: '1-31', name: 'Aava powder', quantity: '1 kg' },
          { id: '1-32', name: 'Kitchen Mop clothes', quantity: "15 no's" },
          { id: '1-33', name: 'Surf', quantity: '' },
          { id: '1-34', name: 'Rice', quantity: '4 bags' },
          { id: '1-35', name: 'Coffe powder', quantity: "10 pkt's @ each 20 Rs/-" },
          { id: '1-36', name: 'Tea powder (Tajmahal - Leaf) Note: We have "Prabath - 500 g" old stock', quantity: '250 g' },
          { id: '1-37', name: 'Papad', quantity: '5 kg' },
          { id: '1-38', name: 'Hanuman Baba Food', quantity: '10 kg' },
          { id: '1-39', name: 'Ginger', quantity: '?' },
          { id: '1-40', name: 'Food plates', quantity: 'need to purchase' },
          { id: '1-41', name: 'Water glasses', quantity: "4,000 no's" },
          { id: '1-42', name: 'Tiffin Plates', quantity: "1,000 no's" },
          { id: '1-43', name: 'Food plates', quantity: "2,000 no's" },
          { id: '1-44', name: 'Tea Glasses', quantity: '' },
          { id: '1-45', name: 'Plastic Spoons', quantity: '' },
          { id: '1-46', name: 'Dopalu', quantity: '' },
        ]
      },
      {
        id: 'cat-2',
        title: '2. Vegetables',
        items: [
          { id: '2-1', name: 'Tamato', quantity: '1 carat' },
          { id: '2-2', name: 'Potato', quantity: '10 kg' },
          { id: '2-3', name: 'Brinjal', quantity: '4 kg' },
          { id: '2-4', name: 'Munakaya', quantity: '1 kg' },
          { id: '2-5', name: 'Green mirchi', quantity: '2 kg' },
          { id: '2-6', name: 'Karevepaku', quantity: '20 Rs/-' },
          { id: '2-7', name: 'kothmer', quantity: "10 no's" },
          { id: '2-8', name: "Aanapakaya (Big - 4 no's OR Small - 8 no's)", quantity: '' },
          { id: '2-9', name: 'Dosakaya', quantity: '10 kg' },
          { id: '2-10', name: 'Keera', quantity: '5 kg' },
          { id: '2-11', name: 'Bendakaya', quantity: '2 kg' },
        ]
      },
      {
        id: 'cat-3',
        title: '3. Mahoor',
        items: [
          { id: '3-1', name: 'Milk', quantity: '?' },
          { id: '3-2', name: 'Curd', quantity: '?' },
          { id: '3-3', name: 'Cylinder', quantity: '1 Domestic' },
        ]
      },
      {
        id: 'cat-4',
        title: '4. Pooja Items',
        items: [
          { id: '4-1', name: 'Samedhalu', quantity: '4 set' },
          { id: '4-2', name: 'Gomaya sticks', quantity: '4 pkt' },
          { id: '4-3', name: 'swasari kwath', quantity: '1 pkt' },
          { id: '4-4', name: 'Havan powder', quantity: '1 pkt' },
          { id: '4-5', name: 'Karpoor', quantity: 'Sufficient' },
          { id: '4-6', name: 'Veebhuthi', quantity: '1 pkt' },
          { id: '4-7', name: 'kumkuma', quantity: '1 pkt' },
          { id: '4-8', name: 'Ricle floor (Mugu)', quantity: 'Sufficient' },
          { id: '4-9', name: 'Gandham - patanjali', quantity: '1 no' },
          { id: '4-10', name: 'Agarbathi', quantity: '1 pkt' },
          { id: '4-11', name: 'Pasupu', quantity: '1 pkt' },
          { id: '4-12', name: 'Rose water', quantity: 'small bottle' },
          { id: '4-13', name: 'Match boxes', quantity: 'Sufficient' },
          { id: '4-14', name: 'Black Nuvulu', quantity: '100 g' },
          { id: '4-15', name: 'Pelalu', quantity: '100 g' },
          { id: '4-16', name: 'Breaking coconuts', quantity: "3 no's" },
          { id: '4-17', name: 'Purnahuti set', quantity: '1 set' },
          { id: '4-18', name: 'Red Cloth (Purnahuti)', quantity: '1 no' },
          { id: '4-19', name: 'Kudaka (Homam)', quantity: '1 no - big' },
          { id: '4-20', name: 'Darba Pullalu', quantity: '?' },
        ]
      },
      {
        id: 'cat-5',
        title: '5. Other Items',
        items: [
          { id: '5-1', name: 'Cobare Tadu', quantity: '?' },
          { id: '5-2', name: 'Papad Jali (Big)', quantity: '1 no' },
        ]
      }
    ];

    function App() {
      // Load from local storage or use initial data
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('smartInventoryData');
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {
            return INITIAL_DATA;
          }
        }
        return INITIAL_DATA;
      });

      const [toastMessage, setToastMessage] = useState(null);
      // listeningState holds { categoryId, itemId, field }
      const [listeningState, setListeningState] = useState(null); 
      const recognitionRef = useRef(null);

      // Save to local storage whenever data changes
      useEffect(() => {
        localStorage.setItem('smartInventoryData', JSON.stringify(data));
      }, [data]);

      // Display toast messages safely instead of using alerts
      const showToast = (message) => {
        setToastMessage(message);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const toggleVoiceInput = (categoryId, itemId, field) => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
          showToast("Voice recognition is not supported in this browser. Please try Chrome or Safari.");
          return;
        }

        // If currently listening to THIS specific input, stop it.
        if (listeningState && listeningState.categoryId === categoryId && listeningState.itemId === itemId && listeningState.field === field) {
          if (recognitionRef.current) recognitionRef.current.stop();
          setListeningState(null);
          return;
        }

        // Stop any existing recognition before starting a new one
        if (recognitionRef.current) {
          recognitionRef.current.stop();
        }

        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US'; 

        recognition.onstart = () => {
          setListeningState({ categoryId, itemId, field });
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          handleVoiceResult(categoryId, itemId, field, transcript);
        };

        recognition.onerror = (event) => {
          console.error("Speech error:", event.error);
          setListeningState(null);
          if(event.error === 'not-allowed') {
             showToast("Microphone access denied. Please allow microphone permissions.");
          }
        };

        recognition.onend = () => {
          setListeningState(null);
        };

        recognitionRef.current = recognition;
        try {
          recognition.start();
        } catch (e) {
          console.error("Failed to start speech recognition", e);
          setListeningState(null);
        }
      };

      const handleVoiceResult = (categoryId, itemId, field, transcript) => {
        setData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          return {
            ...category,
            items: category.items.map(item => {
              if (item.id !== itemId) return item;
              // Append voice text if input already has content, otherwise replace
              const currentValue = item[field] || '';
              const newValue = currentValue.trim().length > 0 
                ? `${currentValue} ${transcript}` 
                : transcript;
              return { ...item, [field]: newValue };
            })
          };
        }));
      };

      const handleInputChange = (categoryId, itemId, field, value) => {
        setData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          return {
            ...category,
            items: category.items.map(item => {
              if (item.id !== itemId) return item;
              return { ...item, [field]: value };
            })
          };
        }));
      };

      const addRow = (categoryId) => {
        setData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          const newItem = {
            id: `item-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
            name: '',
            quantity: ''
          };
          return { ...category, items: [...category.items, newItem] };
        }));
      };

      const deleteRow = (categoryId, itemId) => {
        setData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          return {
            ...category,
            items: category.items.filter(item => item.id !== itemId)
          };
        }));
      };

      const moveRow = (categoryId, index, direction) => {
        setData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          
          const newItems = [...category.items];
          if (direction === 'up' && index > 0) {
            // Swap with previous item
            [newItems[index - 1], newItems[index]] = [newItems[index], newItems[index - 1]];
          } else if (direction === 'down' && index < newItems.length - 1) {
            // Swap with next item
            [newItems[index + 1], newItems[index]] = [newItems[index], newItems[index + 1]];
          }
          return { ...category, items: newItems };
        }));
      };

      const checkIsListening = (categoryId, itemId, field) => {
        return listeningState?.categoryId === categoryId && 
               listeningState?.itemId === itemId && 
               listeningState?.field === field;
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-16">
          
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-white px-4 py-2 rounded shadow-lg text-sm transition-all text-center w-11/12 max-w-sm">
              {toastMessage}
            </div>
          )}

          {/* Main Header mimicking the design */}
          <header className="sticky top-0 z-40 bg-[#28498c] text-white shadow-md">
            <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-center gap-2">
              <Icons.Clipboard />
              <h1 className="text-xl font-bold tracking-wide">Actual List</h1>
            </div>
          </header>

          <main className="max-w-4xl mx-auto p-2 sm:p-4 mt-2 space-y-6">
            
            {data.map((category) => (
              <div key={category.id} className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                
                {/* Category Header */}
                <div className="bg-[#00a8e8] text-white px-4 py-2">
                  <h2 className="text-lg font-bold text-center">{category.title}</h2>
                </div>

                {/* Table Headers */}
                <div className="flex bg-[#00a8e8] text-white text-xs font-semibold px-2 py-1.5 border-t border-[#0092c9]">
                  <div className="w-10 text-center">S. NO</div>
                  <div className="flex-1 text-center border-l border-white/20 pl-2">ITEMS</div>
                  <div className="w-24 sm:w-32 text-center border-l border-white/20 pl-2">QUANTITY</div>
                  <div className="w-14 sm:w-16"></div>
                </div>

                {/* Items List */}
                <div className="divide-y divide-slate-100">
                  {category.items.length === 0 ? (
                    <div className="p-4 text-center text-slate-400 text-sm">No items in this category.</div>
                  ) : (
                    category.items.map((item, index) => (
                      <div key={item.id} className="flex items-start px-2 py-2 hover:bg-slate-50 transition-colors">
                        
                        {/* Auto-sorted S.No based on index */}
                        <div className="w-10 flex items-center justify-center text-sm text-slate-500 font-medium pt-1.5">
                          {index + 1}
                        </div>

                        {/* Items Input */}
                        <div className="flex-1 px-1 sm:px-2 relative">
                          <input 
                            type="text"
                            value={item.name}
                            onChange={(e) => handleInputChange(category.id, item.id, 'name', e.target.value)}
                            placeholder="Item name"
                            className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm pr-8 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-shadow"
                          />
                          <button 
                            onClick={() => toggleVoiceInput(category.id, item.id, 'name')}
                            className="absolute right-3 sm:right-4 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-blue-500 p-1"
                            aria-label="Voice input for item name"
                          >
                            {checkIsListening(category.id, item.id, 'name') ? <Icons.MicActive /> : <Icons.Mic />}
                          </button>
                        </div>

                        {/* Quantity Input */}
                        <div className="w-24 sm:w-32 px-1 relative">
                          <input 
                            type="text"
                            value={item.quantity}
                            onChange={(e) => handleInputChange(category.id, item.id, 'quantity', e.target.value)}
                            placeholder="Qty"
                            className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm pr-7 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-shadow"
                          />
                           <button 
                            onClick={() => toggleVoiceInput(category.id, item.id, 'quantity')}
                            className="absolute right-2 sm:right-3 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-blue-500 p-0.5"
                            aria-label="Voice input for quantity"
                          >
                            {checkIsListening(category.id, item.id, 'quantity') ? <Icons.MicActive className="w-3.5 h-3.5" /> : <Icons.Mic className="w-3.5 h-3.5" />}
                          </button>
                        </div>

                        {/* Action Buttons (Up/Down/Delete) */}
                        <div className="w-14 sm:w-16 flex items-center justify-between px-1 pt-0.5 sm:pt-1">
                          <div className="flex flex-col gap-1">
                            <button 
                              onClick={() => moveRow(category.id, index, 'up')}
                              disabled={index === 0}
                              className={`p-0.5 rounded leading-none flex items-center justify-center ${index === 0 ? 'text-slate-200 cursor-not-allowed' : 'text-slate-400 hover:text-blue-500 hover:bg-slate-100'}`}
                              aria-label="Move row up"
                            >
                              <Icons.ArrowUp />
                            </button>
                            <button 
                              onClick={() => moveRow(category.id, index, 'down')}
                              disabled={index === category.items.length - 1}
                              className={`p-0.5 rounded leading-none flex items-center justify-center ${index === category.items.length - 1 ? 'text-slate-200 cursor-not-allowed' : 'text-slate-400 hover:text-blue-500 hover:bg-slate-100'}`}
                              aria-label="Move row down"
                            >
                              <Icons.ArrowDown />
                            </button>
                          </div>
                          <button 
                            onClick={() => deleteRow(category.id, item.id)}
                            className="text-slate-300 hover:text-red-500 transition-colors p-1"
                            aria-label="Delete row"
                          >
                            <Icons.Trash />
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {/* Add Item Button (+) */}
                <div className="bg-slate-50 p-2 border-t border-slate-100 flex justify-center">
                  <button 
                    onClick={() => addRow(category.id)}
                    className="flex items-center gap-1 text-sm font-semibold text-blue-600 bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-full transition-colors w-full justify-center sm:w-auto shadow-sm"
                  >
                    <Icons.Plus /> Add New Detail
                  </button>
                </div>
                
              </div>
            ))}
            
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
