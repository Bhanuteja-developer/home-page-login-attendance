<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Tactical HUD Background */
        body {
            background-image: 
                linear-gradient(rgba(17, 19, 24, 0.95), rgba(17, 19, 24, 0.95)),
                linear-gradient(90deg, rgba(71, 214, 255, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(71, 214, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            background-position: center center;
        }

        /* Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.1) 50%,
                rgba(0, 0, 0, 0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 40;
            opacity: 0.3;
        }

        /* Neon Glows */
        .glow-border {
            box-shadow: 0 0 10px rgba(71, 214, 255, 0.2), inset 0 0 10px rgba(71, 214, 255, 0.1);
            border: 1px solid rgba(71, 214, 255, 0.3);
        }
        
        .glow-text {
            text-shadow: 0 0 8px rgba(71, 214, 255, 0.6);
        }

        /* Biometric Scanner Animation */
        @keyframes scan-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(71, 214, 255, 0.7); }
            70% { transform: scale(1.1); opacity: 0.8; box-shadow: 0 0 0 20px rgba(71, 214, 255, 0); }
            100% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(71, 214, 255, 0); }
        }
        .scanner-ring-1 {
            animation: scan-rotate 10s linear infinite;
        }
        .scanner-ring-2 {
            animation: scan-rotate 15s linear infinite reverse;
        }
        .scanner-pulse {
            animation: pulse-ring 2s infinite cubic-bezier(0.66, 0, 0, 1);
        }

        /* Tactical Button Styling */
        .tactical-btn {
            position: relative;
            overflow: hidden;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .tactical-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg);
            transition: left 0.5s;
        }
        .tactical-btn:hover::before {
            left: 150%;
        }
        
        /* Hexagon Clip */
        .hex-clip {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col antialiased">
<div class="scanlines"></div>
<!-- TopAppBar (Tactical) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-gutter h-16 bg-surface/80 backdrop-blur-md border-b border-primary/20 glow-border">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-2xl glow-text">radar</span>
<span class="font-headline-md text-[20px] font-bold text-primary tracking-widest uppercase">TAC-CMD</span>
</div>
<div class="flex items-center gap-md">
<div class="flex items-center gap-xs px-2 py-1 bg-surface-container rounded border border-secondary/30">
<div class="w-2 h-2 rounded-full bg-secondary animate-pulse"></div>
<span class="font-code-sm text-code-sm text-secondary uppercase tracking-wider">Secure</span>
</div>
<button aria-label="Profile Menu" class="relative group cursor-pointer active:scale-95 transition-transform">
<div class="hex-clip w-8 h-8 bg-surface-container flex items-center justify-center border border-primary p-0.5 group-hover:border-primary-container transition-colors">
<img alt="User Avatar" class="w-full h-full object-cover hex-clip" data-alt="A professional headshot of a diverse corporate employee with a warm expression, suitable for a secure enterprise user profile avatar. Clean, modern lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDpG_xOMVQQAbiuZ5mOWruxH9G5G4isXxiMdc-91pEXpfqM_YlZU5Wa6gnR4kCf8jVXums0-TK3wW8GYixMxZGcS1CWr70aD-VRb-l0vSbhPvW-1j8lWdgy-22TaZiJ5qyIKPSDHXsjY-MWdZphiMjzB72dwsiXD7Hh2Nfubib-pK7lrMOC_pADZ-i9L4HTxZrDc31OKyR1V7x4E49LZvlgQFikgVATEmZk_2GpXnC_xqtkHaRhPi0IeL4QKAoK_u1O79VSYz8S71k"/>
</div>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-20 pb-24 px-md flex flex-col gap-stack-lg max-w-lg mx-auto w-full relative z-10">
<!-- HUD Header Section -->
<div class="flex flex-col gap-stack-sm glow-border bg-surface-container/50 p-4 rounded-sm border-l-4 border-l-primary relative overflow-hidden">
<div class="absolute top-0 right-0 p-2 opacity-20 text-primary">
<span class="material-symbols-outlined text-4xl">memory</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-background uppercase tracking-widest text-sm text-primary">System Clock</h1>
<div class="flex flex-col">
<span class="font-display-lg text-[40px] font-bold text-primary glow-text font-mono tracking-tight" id="tactical-time">22:52:06.145</span>
<span class="font-code-sm text-code-sm text-on-surface-variant uppercase tracking-widest" id="tactical-date">09 JUN 2026 / IST_ZONE</span>
</div>
</div>
<!-- Biometric Scanner Area -->
<div class="flex flex-col items-center justify-center gap-stack-lg py-8">
<div class="relative w-64 h-64 flex items-center justify-center" id="scanner-container">
<!-- Outer Rings -->
<div class="absolute inset-0 rounded-full border-2 border-dashed border-primary/30 scanner-ring-1"></div>
<div class="absolute inset-4 rounded-full border border-primary/20 scanner-ring-2">
<div class="absolute top-0 left-1/2 w-2 h-2 bg-primary rounded-full -translate-x-1/2 -translate-y-1/2 glow-text"></div>
</div>
<!-- Pulse Ring -->
<div class="absolute inset-8 rounded-full border-2 border-primary/50 scanner-pulse"></div>
<!-- Scanner Core -->
<div class="absolute inset-12 rounded-full bg-surface-container-high/80 backdrop-blur-sm border border-primary flex items-center justify-center glow-border cursor-pointer hover:bg-primary/10 transition-colors" onclick="startScanFlow()">
<span class="material-symbols-outlined text-5xl text-primary glow-text" id="scan-icon">fingerprint</span>
</div>
<!-- Data Overlay -->
<div class="absolute -top-4 -left-4 text-primary opacity-50 font-mono text-[10px]">AUTH_REQ</div>
<div class="absolute -bottom-4 -right-4 text-primary opacity-50 font-mono text-[10px]">NODE_XYZ</div>
</div>
<p class="font-code-sm text-code-sm text-on-surface-variant uppercase tracking-widest text-center" id="scan-status">Awaiting Biometric Input</p>
</div>
<!-- Action Grid -->
<div class="grid grid-cols-2 gap-gutter w-full mt-auto">

<span class="material-symbols-outlined">login</span>

</button>

<span class="material-symbols-outlined text-sm">power_settings_new</span>
    TERMINATE SHIFT

</main>
<!-- Bottom Navigation (Tactical) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 bg-surface/90 backdrop-blur-md border-t border-primary/20 glow-border md:hidden pb-safe">

<span class="material-symbols-outlined fill">terminal</span>

<span class="material-symbols-outlined">dataset</span>

</button>

<span class="material-symbols-outlined">admin_panel_settings</span>
<span class="font-code-sm text-[10px] uppercase tracking-wider mt-1">Operative</span>
</button>

<script>
    // Tactical Clock with Milliseconds
    function updateTacticalClock() {
        const now = new Date();
        
        // Time
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const millis = String(now.getMilliseconds()).padStart(3, '0');
        document.getElementById('tactical-time').textContent = `${hours}:${minutes}:${seconds}.${millis}`;
        
        // Date
        const day = String(now.getDate()).padStart(2, '0');
        const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        const month = months[now.getMonth()];
        const year = now.getFullYear();
        document.getElementById('tactical-date').textContent = `${day} ${month} ${year} / IST_ZONE`;
        
        requestAnimationFrame(updateTacticalClock);
    }
    updateTacticalClock();

    // Simulated Biometric Scan Flow
    function startScanFlow() {
        const icon = document.getElementById('scan-icon');
        const status = document.getElementById('scan-status');
        const container = document.getElementById('scanner-container');
        
        status.textContent = 'SCANNING...';
        status.classList.add('text-primary', 'animate-pulse');
        icon.textContent = 'radar';
        
        setTimeout(() => {
            status.textContent = 'VERIFYING NODE...';
        }, 1500);

        setTimeout(() => {
            status.textContent = 'ACCESS GRANTED';
            status.classList.remove('animate-pulse');
            status.classList.add('text-secondary');
            icon.textContent = 'check_circle';
            icon.classList.remove('text-primary');
            icon.classList.add('text-secondary');
            
            // Turn rings green
            const rings = container.querySelectorAll('.border-primary, .border-primary\\/30, .border-primary\\/20, .border-primary\\/50');
            rings.forEach(ring => {
                ring.classList.remove('border-primary', 'border-primary/30', 'border-primary/20', 'border-primary/50');
                ring.classList.add('border-secondary/50');
            });
            
            setTimeout(() => {
                resetScanFlow();
            }, 3000);
        }, 3000);
    }

    function resetScanFlow() {
        const icon = document.getElementById('scan-icon');
        const status = document.getElementById('scan-status');
        const container = document.getElementById('scanner-container');
        
        status.textContent = 'Awaiting Biometric Input';
        status.className = 'font-code-sm text-code-sm text-on-surface-variant uppercase tracking-widest text-center';
        icon.textContent = 'fingerprint';
        icon.className = 'material-symbols-outlined text-5xl text-primary glow-text';
        
        // Reset rings
        const rings = container.querySelectorAll('.border-secondary\\/50');
        rings.forEach(ring => {
             ring.classList.remove('border-secondary/50');
             // Re-add original classes based on element type (simplified reset)
             if(ring.classList.contains('scanner-ring-1')) ring.classList.add('border-primary/30');
             else if(ring.classList.contains('scanner-ring-2')) ring.classList.add('border-primary/20');
             else if(ring.classList.contains('scanner-pulse')) ring.classList.add('border-primary/50');
             else ring.classList.add('border-primary');
        });
    }

    function initiateClockIn() {
        startScanFlow();
    }
</script>
