function applyMaterialSymbols(root=document.body){
  const iconMap={
    '✓':'check_circle','⌖':'location_on','◷':'schedule','←':'arrow_back','→':'arrow_forward',
    '◉':'face','⚑':'flag','↗':'open_in_new','◎':'my_location','♙':'person',

    '⚙':'settings','☷':'view_list','🔒':'lock','✧':'auto_awesome','‹':'chevron_left',
    '›':'chevron_right','⌄':'keyboard_arrow_down','↪':'logout','⋯':'more_horiz','×':'close'
  };
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()){
    const node=walker.currentNode;
    if(!node.nodeValue || !/[✓⌖◷←→◉⚑↗◎♙⌁✎♧▤✉↓▣✦☀☺👋☎＋⌂▦▥⚙☷🔒✧‹›⌄↪⋯×]/u.test(node.nodeValue)) continue;
    const parent=node.parentElement;
    if(!parent || parent.closest('script,style,textarea, input, .material-symbols-rounded')) continue;
    nodes.push(node);
  }
  for(const node of nodes){
    const text=node.nodeValue;
    const fragment=document.createDocumentFragment();
    let buffer='';
    for(const ch of text){
      const name=iconMap[ch];
      if(name){
        if(buffer){fragment.appendChild(document.createTextNode(buffer));buffer='';}
        const span=document.createElement('span');
        span.className='material-symbols-rounded';
        span.setAttribute('aria-hidden','true');
        span.textContent=name;
        fragment.appendChild(span);
      }else buffer+=ch;
    }
    if(buffer) fragment.appendChild(document.createTextNode(buffer));
    node.parentNode.replaceChild(fragment,node);
  }
}

utton></div>`}

function geofenceForm(){return `${sectionHead('Location & rules / Geofences','Configure geofence','Set the boundary, employee assignments, and attendance enforcement policy.',btn('← Back to geofences','outline','go(\'geofences\')'))}<div class="grid-2"><div class="card"><div class="card-head"><div><div class="h2" style="font-size:16px">Site details</div><div class="muted tiny" style="margin-top:4px">Name and geographic boundary</div></div>${pill('Draft','blue')}</div><div class="field"><label>Geofence name *</label><input value="Hyderabad HQ" /></div><div class="field"><label>Site address / description</label><input value="HITEC City, Hyderabad, Telangana" /></div><div class="field"><label>Boundary type</label><div class="segmented"><button id="circleTab" class="${state.geoType==='Circle'?'active':''}" onclick="state.geoType='Circle';render()">Circle radius</button><button id="polyTab" class="${state.geoType==='Polygon'?'active':''}" onclick="state.geoType='Polygon';render()">Polygon boundary</button></div></div>${state.geoType==='Circle'?`<div class="grid-2"><div class="field"><label>Center latitude</label><input value="17.4435" /></div><div class="field"><label>Center longitude</label><input value="78.3772" /></div></div><div class="field"><label>Radius · meters <strong id="radiusLabel">${state.radius} m</strong></label><input type="range" min="50" max="1000" step="25" value="${state.radius}" oninput="state.radius=+this.value;document.getElementById('radiusLabel').textContent=this.value+' m'" style="width:100%;accent-color:var(--primary)" /><div class="hint">Choose a radius that suits the site and expected GPS accuracy. Very small radii may produce unreliable indoor results.</div></div>`:`<div class="field"><label>Polygon coordinates</label><textarea>17.4440, 78.3760\n17.4450, 78.3790\n17.4420, 78.3800\n17.4410, 78.3770</textarea><div class="hint">In production, provide a map drawing tool to add, move, and validate polygon vertices.</div></div>`}<div class="field"><label>Assigned employees / groups</label><select><option>Engineering — Hyderabad HQ (231)</option><option>Operations — Secunderabad (42)</option><option>Project team — Madhapur (18)</option></select></div><div class="grid-2"><div class="field"><label>Valid from</label><input type="date" value="2026-01-01" /></div><div class="field"><label>Valid until</label><input type="date" /></div></div><div class="field"><label>Geofence status</label><select><option>Active</option><option>Inactive</option></select></div></div><div><div class="card"><div class="card-head"><div><div class="h2" style="font-size:16px">Boundary preview</div><div class="muted tiny" style="margin-top:4px">Illustrative map · sample coordinates</div></div>${pill(state.geoType,'blue')}</div>${mapMarkup(true,state.geoType==='Polygon')}<div class="map-legend"><span><i class="legend-dot" style="background:#596af2"></i>Allowed boundary</span><span><i class="legend-dot" style="background:#0d9488"></i>Sample user location</span></div></div><div class="card section-gap"><div class="card-head"><strong>Attendance enforcement</strong></div><div class="field"><label>Check-in policy</label><select id="geoModeSelect" onchange="state.geofenceMode=this.value"><option ${state.geofenceMode==='Strict'?'selected':''}>Strict</option><option ${state.geofenceMode==='Warning'?'selected':''}>Warning</option><option ${state.geofenceMode==='Review'?'selected':''}>Review</option></select><div class="hint">Strict rejects outside-boundary check-ins. Warning records them as exceptions. Review requires administrator approval.</div></div><div class="field"><label>Check-out policy</label><select><option>Flag outside boundary</option><option>Require inside boundary</option><option>No geofence validation</option></select></div><div class="field"><label>Minimum GPS accuracy (meters)</label><input type="number" value="50" min="5" max="500" /></div><div class="field"><label>Boundary tolerance (meters)</label><input type="number" value="25" function geofenceEvents(){return `${sectionHead('Location & rules / Alerts','Geofence alerts','Review boundary exceptions, stale location updates, and entry/exit events.',btn('Export exceptions','outline','toast(\'Exception report export requested\')')+btn('Geofence settings','primary','go(\'geofences\')'))}<div class="grid-3" style="margin-bottom:17px">${statCard('⚑','Open alerts','4','Require review')}${statCard('✓','Resolved today','12','Across all active sites')}${statCard('⌖','Stale location events','3','Not a boundary violation by itself')}</div><div class="filter-row"><input class="search-input" placeholder="Search employee / site…" oninput="filterAlerts(this.value)"/><select><option>All alert types</option><option>Outside boundary</option><option>Exit event</option><option>Stale location</option></select><select><option>Open & unresolved</option><option>All statuses</option><option>Resolved</option></select><select><option>Today</option><option>Last 7 days</option></select></div><div id="alertsList" class="card">${alertRow('Arjun Reddy','Outside assigned geofence at check-in','Secunderabad Branch · 09:17 AM · Accuracy ±42 m','Outside boundary','amber','Open')}${alertRow('Vikram Singh','Location update has become stale','Madhapur Project Site · Last update 22 min ago','Stale location','red','Open')}${alertRow('Priya Sharma','Exited site boundary during active session','Hyderabad HQ · 10:14 AM · Accuracy ±19 m','Exit event','amber','Open')}${alertRow('EMP-1088','Geofence validation required review','Hyderabad HQ · 08:59 AM · Accuracy ±86 m','Uncertain GPS','blue','Open')}</div><div class="notice" style="margin-top:14px">A geofence alert is a review signal, not proof of misconduct. Inspect accuracy, timestamp, device conditions, and any approved off-site assignment before resolving it.</div>`}
function alertRow(name,title,desc,type,color,status){return `<div class="alert-item" data-search="${(name+' '+title+' '+desc+' '+type).toLowerCase()}"><div class="alert-mark ${color==='red'?'red':color==='blue'?'blue':''}">${color==='red'?'⌖':color==='blue'?'◎':'⚑'}</div><div class="alert-body"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><strong>${title}</strong>${pill(status,'amber')}</div><p><b>${name}</b> · ${desc}</p><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">${pill(type,color==='red'?'red':color==='blue'?'blue':'amber')}<button class="btn small-btn outline" onclick="openModal('Review geofence event','<p><b>${name}</b></p><p>${title}</p><p class=muted>${desc}</p><div class=field><label>Resolution</label><select><option>Reviewed — no action</option><option>Approved off-site duty</option><option>Attendance correction required</option><option>Escalate for investigation</option></select></div><div class=field><label>Reviewer notes</label><textarea placeholder=\'Record the review rationale\'></textarea></div><button class=\'btn primary block\' onclick=\'closeModal();toast(\\\'Review saved to demo audit log\\\')\'>Save review</button>')">Review</button><button class="btn small-btn secondary" onclick="toast('Alert marked resolved in demo')">Resolve</button></div></div></div>`}
function filterAlerts(q){document.querySelectorAll('#alertsList .alert-item').forEach(el=>el.style.display=el.dataset.search.includes(q.toLowerCase())?'flex':'none')}
function adminReports(){return `${sectionHead('Insights','Reports & analytics','Explore attendance trends, geofence exceptions, and workforce activity.',btn('↓ Export CSV','primary','toast(\'CSV export prepared in demo\')'))}<div class="card"><div class="card-head"><div><div class="h2" style="font-size:16px">Report filters</div><div class="muted tiny" style="margin-top:5px">Configure the report and export authorized records</div></div></div><div class="grid-3"><div class="field"><label>Report type</label><select><option>Monthly attendance summary</option><option>Daily attendance</option><option>Late arrivals & absences</option><option>Geofence exceptions</option><option>Face verification failures</option><option>Location tracking coverage</option></select></div><div class="field"><label>Date from</label><input type="date" value="2026-10-01" /></div><div class="field"><label>Date to</label><input type="date" value="2026-10-28" /></div><div class="field"><label>Department</label><select><option>All departments</option><option>Engineering</option><option>Operations</option><option>Finance</option></select></div><div class="field"><label>Work site</label><select><option>All sites</option><option>Hyderabad HQ</option><option>Secunderabad Branch</option></select></div><div class="field"><label>Format</label><select><option>CSV</option><option>Excel (.xlsx)</option><option>PDF summary</option></select></div></div><div style="text-align:right">${btn('Generate report','primary','toast(\'Report generated in demo\')')}</div></div><div class="grid-3 section-gap">${statCard('✓','Attendance rate','94.8%','Current selected period')}${statCard('◷','Average check-in','09:04 AM','Across active employees')}${statCard('⚑','Geofence exceptions','38','2.1% of all events')}</div><div class="grid-2 section-gap"><div class="card"><div class="card-head"><strong>Attendance by weekday</strong>${pill('October','blue')}</div><div class="chart-bars">${[['Mon',82],['Tue',90],['Wed',94],['Thu',91],['Fri',86],['Sat',42],['Sun',19]].map(x=>`<div class="bar-group"><div class="bar" style="height:${x[1]}%"></div><span class="bar-label">${x[0]}</span></div>`).join('')}</div></div><div class="card"><div class="card-head"><strong>Geofence result distribution</strong></div><div style="display:flex;align-items:center;gap:22px;padding:15px 0"><div style="width:130px;height:130px;border-radius:50%;background:conic-gradient(#15803d 0 88%,#d97706 88% 95%,#be123c 95% 98%,#94a3b8 98% 100%);position:relative;flex-shrink:0"><div style="position:absolute;inset:23px;background:white;border-radius:50%;display:grid;place-items:center;text-align:center"><div><strong style="font-size:20px">94%</strong><div class="muted tiny">evaluated</div></div></div></div><div style="display:grid;gap:10px;font-size:10px;color:var(--muted)"><span><i class="legend-dot" style="background:#15803d"></i>Inside boundary · 88%</span><span><i class="legend-dot" style="background:#d97706"></i>Review · 7%</span><span><i class="legend-dot" style="background:#be123c"></i>Outside · 3%</span><span><i class="legend-dot" style="background:#94a3b8"></i>Uncertain · 2%</span></div></div></div></div><div class="card section-gap"><div class="card-head"><strong>Report preview</strong><button class="text-link" onclick="toast('Full report export requested')">Export all →</button></div>${attendanceTable(attendance,true)}</div>`}
function adminUsers(){return `${sectionHead('Administration','Users & roles','Manage administrator access with least-privilege permissions.',btn('+ Add admin','primary','openModal(\'Add administrator\',\'<div class=field><label>Name</label><input placeholder=\'Full name\'></div><div class=field><label>Work email</label><input placeholder=\'admin@company.com\'></div><div class=field><label>Role</label><select><option>Attendance Admin</option><option>HR Manager</option><option>Super Admin</option><option>Location Reviewer</option></select></div><button class=\'btn primary block\' onclick=\'closeModal();toast(\\\'Admin invitation created in demo\\\')\'>Send invitation</button>\')'))}<div class="notice" style="margin-bottom:17px">Follow least-privilege access. Access to detailed location history and biometric administration should be limited to roles with an approved business need.</div><div class="table-wrap"><table><thead><tr><th>Administrator</th><th>Role</th><th>Permissions summary</th><th>Last active</th><th>Status</th><th>Actions</th></tr></thead><tbody>${[['Meera Reddy','Super Admin','All modules · system settings','Just now','Active'],['Rohit Nair','HR Manager','Employees · attendance · reports','Today, 09:14','Active'],['Sana Khan','Location Reviewer','Live locations · geofence events','Today, 08:52','Active'],['Kiran Rao','Attendance Admin','Attendance · employee profiles','Yesterday','Inactive']].map(x=>`<tr><td><div class="person"><div class="person-avatar">${initials(x[0])}</div><div><strong>${x[0]}</strong><span>${x[0].toLowerCase().replace(' ','.')}@company.example</span></div></div></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${pill(x[4])}</td><td><button class="icon-btn" onclick="openModal('Edit role','<p>Update role and access to sensitive features for ${x[0]}.</p><div class=field><label>Role</label><select><option>${x[1]}</option><option>Attendance Admin</option><option>HR Manager</option><option>Location Reviewer</option><option>Super Admin</option></select></div><button class=\'btn primary block\' onclick=\'closeModal();toast(\\\'Role updated in demo\\\')\'>Save role</button>')">✎</button></td></tr>`).join('')}</tbody></table></div><div class="card section-gap"><div class="card-head"><strong>Role matrix</strong><span class="muted tiny">Illustrative permissions</span></div><div class="table-wrap"><table><thead><tr><th>Module</th><th>Super Admin</th><th>HR Manager</th><th>Attendance Admin</th><th>Location Reviewer</th></tr></thead><tbody>${[['Employee CRUD','Full','Read / update','Read / limited update','No access'],['Attendance CRUD','Full','Full','Full','Read only'],['Precise live location','Full','Limited','No access','Assigned sites'],['Geofence configuration','Full','Read only','Read only','Review only'],['Roles & security','Full','No access','No access','No access'],['Audit logs','Full','Limited','Limited','Location events']].map(row=>`<tr>${row.map((x,i)=>`<td>${i===0?'<strong>'+x+'</strong>':pill(x,x==='Full'?'green':x==='No access'?'gray':'blue')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function adminSettings(){return `${sectionHead('Administration','System settings','Configure attendance policies, tracking behavior, and geofence defaults.',btn('Reset to defaults','outline','openModal(\'Reset configuration\',\'<p>Restore the demo configuration defaults? This does not affect a live system.</p><button class=\'btn danger block\' onclick=\'closeModal();toast(\\\'Demo settings reset\\\')\'>Reset settings</button>\')'))}<div class="grid-2"><div class="card"><div class="card-head"><div><div class="h2" style="font-size:16px">Attendance policy</div><div class="muted tiny" style="margin-top:4px">Work hours and attendance validation</div></div></div><div class="field"><label>Organization timezone</label><select><option>Asia/Kolkata (IST, UTC+05:30)</option><option>UTC</option></select></div><div class="grid-2"><div class="field"><label>Shift start</label><input type="time" value="09:00" /></div><div class="field"><label>Shift end</label><input type="time" value="18:00" /></div><div class="field"><label>Grace period · min</label><input type="number" value="10" /></div><div class="field"><label>Minimum break · min</label><input type="number" value="30" /></div></div><div class="setting-row"><div><strong>Require face verification</strong><span>Required for check-in and check-out</span></div><button class="switch on" onclick="this.classList.toggle('on')"></button></div><div class="setting-row"><div><strong>Require liveness check</strong><span>Use randomized prompts or validated anti-spoofing</span></div><button class="switch on" onclick="this.classList.toggle('on')"></button></div><div class="setting-row"><div><strong>Allow approved manual corrections</strong><span>Require a reason and audit record</span></div><button class="switch on" onclick="this.classList.toggle('on')"></button></div></div><div class="card"><div class="card-head"><div><div class="h2" style="font-size:16px">Geofence & tracking policy</div><div class="muted tiny" style="margin-top:4px">Default behavior for active work sessions</div></div></div><div class="field"><label>Default check-in enforcement</label><select><option>Strict — reject outside</option><option>Warning — allow but flag</option><option>Review — pending approval</option></select></div><div class="field"><label>Default geofence radius · m</label><input type="number" value="250" min="50" /></div><div class="field"><label>Minimum GPS accuracy · m</label><input type="number" value="50" min="5" /></div><div class="field"><label>Location update interval</label><select onchange="state.trackingInterval=this.value"><option>1 minute</option><option selected>5 minutes</option><option>10 minutes</option><option>15 minutes</option></select></div><div class="field"><label>Mark location stale after · min</label><input type="number" value="15" /></div><div class="setting-row"><div><strong>Check-out geofence validation</strong><span>Flag employees checking out outside the site</span></div><button class="switch on" onclick="this.classList.toggle('on')"></button></div><div class="setting-row"><div><strong>Entry/exit alerts</strong><span>Notify reviewers for configured geofence events</span></div><button class="switch on" onclick="this.classList.toggle('on')"></button></div></div><div class="card section-gap"><div class="card-head"><div><div class="h2" style="font-size:16px">Privacy, retention & notifications</div></div></div><div class="grid-3"><div class="field"><label>Location history retention · days</label><input type="number" value="30" /></div><div class="field"><label>Attendance retention · days</label><input type="number" value="365" /></div><div class="field"><label>Biometric template retention</label><select><option>While employee account is active</option><option>Custom policy</option></select></div></div>${[['Notify on outside-boundary attendance','Alert the assigned reviewer',true],['Notify on stale locations','Alert after configured threshold',true],['Show employee tracking indicator','Make active function auditLog(){const logs=[['11:08:42','Meera Reddy','Updated geofence radius','Geofence · HQ-001','Radius 200 m → 250 m'],['10:42:11','Rohit Nair','Approved attendance correction','Attendance · ATT-2811','Reason required and recorded'],['09:18:03','System','Geofence exception created','Employee · EMP-1044','Outside assigned boundary'],['08:30:15','Meera Reddy','Changed employee site assignment','Employee · EMP-1046','Assigned to Madhapur project site'],['Yesterday','Sana Khan','Reviewed stale location alert','Location event · LOC-02918','Marked as connectivity interruption']];return `${sectionHead('Administration / Audit','Audit log','Review administrative changes and security-relevant events. Sensitive changes should be traceable.',btn('Export audit log','outline','toast(\'Audit export requested\')'))}<div class="notice" style="margin-bottom:16px">Audit records should be append-only or otherwise protected against silent modification. This screen shows illustrative demo records.</div><div class="filter-row"><input class="search-input" placeholder="Search actor, action, or record…" oninput="filterTable(this.value)"/><select><option>All event types</option><option>Authentication</option><option>Attendance changes</option><option>Geofence changes</option><option>Role changes</option></select><select><option>Last 7 days</option><option>Today</option><option>Last 30 days</option></select></div><div class="table-wrap"><table><thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Target record</th><th>Change summary</th><th>Details</th></tr></thead><tbody>${logs.map(x=>`<tr><td>${x[0]}<div class="muted tiny">28 Oct 2026</div></td><td>${x[1]}</td><td><strong>${x[2]}</strong></td><td>${x[3]}</td><td>${x[4]}</td><td><button class="icon-btn" onclick="openModal('Audit event details','<p><b>${x[2]}</b></p><p>Actor: ${x[1]}</p><p>Record: ${x[3]}</p><p>${x[4]}</p><p class=muted>Production audit records should include event ID, exact server timestamp, outcome, and relevant before/after fields where appropriate.</p>')">↗</button></td></tr>`).join('')}</tbody></table></div>`}

function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
