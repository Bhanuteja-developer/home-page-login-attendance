<script>
        document.addEventListener('DOMContentLoaded', () => {
            const stickCountSelect = document.getElementById('stickCount');
            const inputGrid = document.getElementById('inputGrid');
            const totalDisplay = document.getElementById('totalRamDisplay');
            const summarySticks = document.getElementById('summarySticks');
            const summaryDetailsList = document.getElementById('summaryDetailsList');

            // Initial render
            renderInputs();

            stickCountSelect.addEventListener('change', renderInputs);

            function renderInputs() {
                const count = parseInt(stickCountSelect.value);
                summarySticks.textContent = count;
                
                // Clear existing inputs
                inputGrid.innerHTML = '';
                
                // Generate new inputs
                for (let i = 1; i <= count; i++) {
                    const div = document.createElement('div');
                    div.className = 'flex flex-col gap-xs';
                    div.innerHTML = `
                        <label class="font-label-caps text-label-caps text-secondary" for="stick${i}">STICK - ${i} (GB)</label>
                        <div class="relative">
                            <input class="ram-input w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-sm py-sm font-code-mono text-code-mono text-on-surface focus:border-primary focus:ring-2 focus:ring-primary-container/30 transition-all outline-none" id="stick${i}" min="0" placeholder="0" step="1" type="number" data-stick="${i}"/>
                            <span class="absolute right-sm top-1/2 -translate-y-1/2 font-code-mono text-code-mono text-outline pointer-events-none">GB</span>
                        </div>
                    `;
                    inputGrid.appendChild(div);
                }

                // Re-attach listeners to new inputs
                const newInputs = document.querySelectorAll('.ram-input');
                newInputs.forEach(input => {
                    input.addEventListener('input', calculateTotal);
                    input.addEventListener('keydown', (e) => {
                        if(e.key === '-' || e.key === 'e') {
                            e.preventDefault();
                        }
                    });
                });
                
                // Recalculate based on new inputs (initially empty)
                calculateTotal();
            }

            function calculateTotal() {
                const inputs = document.querySelectorAll('.ram-input');
                let total = 0;
                let summaryHTML = '';

                inputs.forEach(input => {
                    const val = parseFloat(input.value);
                    const stickNum = input.getAttribute('data-stick');
                    const displayVal = (!isNaN(val) && val > 0) ? val : 0;
                    
                    if (!isNaN(val) && val > 0) {
                        total += val;
                    }

                    summaryHTML += `
                        <div class="flex justify-between items-center w-full">
                            <span class="font-body-sm text-body-sm text-secondary">Stick ${stickNum} Size</span>
                            <span class="font-body-sm text-body-sm text-on-surface font-medium">${displayVal}GB</span>
                        </div>
                    `;
                });
                
                summaryDetailsList.innerHTML = summaryHTML;
                
                // Animate value change slightly
                totalDisplay.style.opacity = '0.5';
                setTimeout(() => {
                    totalDisplay.textContent = total;
                    totalDisplay.style.opacity = '1';
                }, 100);
            }
        });
    </script>
<script>
    (function() {
        const procInput = document.getElementById('processorInput');
        const expansion = document.getElementById('processorExpansion');
        const applyBtn = document.getElementById('applyProcessor');
        const standardInput = document.getElementById('procStandardInput');
        const radios = document.getElementsByName('procType');

        procInput.addEventListener('click', () => {
            expansion.classList.toggle('hidden');
        });

        // Initialize pickers
        function initPicker(containerId, initialValue) {
            const container = document.getElementById(containerId);
            if (!container) return;

            // Add padding items
            container.innerHTML += `<div class="picker-item"></div>`;

            for (let i = 0; i <= 25; i++) {
                container.innerHTML += `<div class="picker-item" data-value="${i}">${i}</div>`;
            }

            // Add padding items
            container.innerHTML += `<div class="picker-item"></div>`;

            let isScrolling;
            let lastActiveIndex = -1;
            const itemHeight = 40;

            container.addEventListener('scroll', () => {
                window.clearTimeout(isScrolling);

                const centerPosition = container.scrollTop + (container.clientHeight / 2);
                const items = container.querySelectorAll('.picker-item[data-value]');
                
                let activeIndex = -1;

                items.forEach((item, index) => {
                    const itemTop = item.offsetTop;
                    const itemBottom = itemTop + itemHeight;
                    
                    if (centerPosition >= itemTop && centerPosition <= itemBottom) {
                        item.classList.add('active');
                        activeIndex = index;
                    } else {
                        item.classList.remove('active');
                    }
                });

                if (activeIndex !== lastActiveIndex && activeIndex !== -1) {
                    console.log(`Tick: ${activeIndex}`);
                    // Simulate subtle tick
                    container.parentElement.style.transform = 'scale(0.98)';
                    setTimeout(() => container.parentElement.style.transform = 'scale(1)', 50);
                    lastActiveIndex = activeIndex;
                }

                // Snap logic
                isScrolling = setTimeout(function() {
                    if (activeIndex !== -1) {
                         const targetItem = items[activeIndex];
                         container.scrollTo({
                             top: targetItem.offsetTop - (container.clientHeight / 2) + (itemHeight / 2),
                             behavior: 'smooth'
                         });
                    }
                }, 150);
            });

            // Set initial value
            setTimeout(() => {
                const initialItem = container.querySelector(`.picker-item[data-value="${initialValue}"]`);
                if(initialItem) {
                     container.scrollTo({
                         top: initialItem.offsetTop - (container.clientHeight / 2) + (itemHeight / 2),
                         behavior: 'auto'
                     });
                }
            }, 50);
        }

        // Delay init to ensure DOM is ready and visible
        setTimeout(() => {
             initPicker('picker-series', 3);
             initPicker('picker-gen', 4);
        }, 100);
        

        applyBtn.addEventListener('click', () => {
            let selectedType = 'standard';
            radios.forEach(r => { if(r.checked) selectedType = r.value; });

            if (selectedType === 'standard') {
                procInput.value = standardInput.value || 'Standard Processor';
            } else {
                const seriesPicker = document.getElementById('picker-series');
                const genPicker = document.getElementById('picker-gen');
                
                const activeSeries = seriesPicker.querySelector('.picker-item.active');
                const activeGen = genPicker.querySelector('.picker-item.active');

                const series = activeSeries ? activeSeries.getAttribute('data-value') : '3';
                const gen = activeGen ? activeGen.getAttribute('data-value') : '4';

                procInput.value = `i${series}-${gen}-GEN`;
            }
            expansion.classList.add('hidden');
        });

        // Close expansion when clicking outside
        document.addEventListener('click', (e) => {
            if (!procInput.contains(e.target) && !expansion.contains(e.target)) {
                expansion.classList.add('hidden');
            }
        });
    })();
</script>
</body></html>
