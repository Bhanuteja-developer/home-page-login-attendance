<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>AssetFlow - Secure Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-high": "#eae7e7",
                      "secondary": "#8c4c4d",
                      "tertiary-fixed-dim": "#cfc4c4",
                      "on-background": "#1c1b1b",
                      "tertiary": "#655c5d",
                      "primary-fixed-dim": "#e8b7e8",
                      "outline-variant": "#d0c3cc",
                      "on-error": "#ffffff",
                      "inverse-on-surface": "#f3f0ef",
                      "primary-fixed": "#ffd6fe",
                      "on-secondary": "#ffffff",
                      "on-secondary-fixed": "#390b0e",
                      "outline": "#7f747d",
                      "on-secondary-container": "#793d3e",
                      "on-primary-fixed-variant": "#5f3962",
                      "surface-container": "#f0eded",
                      "inverse-primary": "#e8b7e8",
                      "on-primary": "#ffffff",
                      "error": "#ba1a1a",
                      "inverse-surface": "#313030",
                      "secondary-container": "#fdacac",
                      "on-tertiary": "#ffffff",
                      "surface-bright": "#fcf9f8",
                      "on-surface": "#1c1b1b",
                      "tertiary-fixed": "#ece0e0",
                      "surface-container-low": "#f6f3f2",
                      "on-primary-container": "#7b527e",
                      "surface-tint": "#79507b",
                      "surface-container-highest": "#e5e2e1",
                      "on-tertiary-fixed-variant": "#4d4545",
                      "surface-dim": "#dcd9d9",
                      "tertiary-container": "#e5d9d9",
                      "on-primary-fixed": "#2f0c34",
                      "background": "#fcf9f8",
                      "on-tertiary-container": "#675e5f",
                      "on-secondary-fixed-variant": "#703537",
                      "surface-variant": "#e5e2e1",
                      "secondary-fixed-dim": "#ffb3b3",
                      "primary": "#79507b",
                      "on-tertiary-fixed": "#201a1a",
                      "primary-container": "#ffccff",
                      "secondary-fixed": "#ffdad9",
                      "on-error-container": "#93000a",
                      "on-surface-variant": "#4d444c",
                      "error-container": "#ffdad6",
                      "surface": "#fcf9f8",
                      "surface-container-lowest": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "2xl": "1.5rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-margin": "32px",
                      "unit": "8px",
                      "card-padding": "32px",
                      "gutter": "24px"
              },
              "fontFamily": {
                      "label-md": ["Inter"],
                      "label-sm": ["Inter"],
                      "headline-md": ["Inter"],
                      "headline-xl": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-lg": ["Inter"],
                      "body-md": ["Inter"]
              },
              "fontSize": {
                      "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500"}],
                      "label-sm": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "headline-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.3) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 20px 40px -10px rgba(31, 38, 135, 0.15),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.8),
                inset 0 0 20px rgba(255, 255, 255, 0.3);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.7);
            border-color: #ffccff; /* primary-container */
            box-shadow: 0 0 0 4px rgba(255, 204, 255, 0.2), inset 0 2px 4px rgba(0,0,0,0.02);
            outline: none;
        }
        .bg-mesh {
            background-color: #f6f3f2;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 204, 255, 0.5), transparent 60%),
                radial-gradient(circle at 85% 30%, rgba(253, 172, 172, 0.4), transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(232, 183, 232, 0.4), transparent 60%);
            position: relative;
        }
        /* Subtle Grid Overlay */
        .bg-mesh::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #79507b 0%, #5f3962 100%);
            box-shadow: 0 8px 24px -6px rgba(121, 80, 123, 0.5);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-gradient:hover {
            box-shadow: 0 12px 28px -6px rgba(121, 80, 123, 0.6);
            transform: translateY(-1px);
        }
        .btn-gradient:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px -4px rgba(121, 80, 123, 0.4);
        }

        .orb {
            animation: float 10s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-mesh min-h-screen flex items-center justify-center font-body-md text-on-surface antialiased overflow-hidden">
<!-- Floating Orbs for extra depth -->
<div class="orb absolute top-1/4 left-1/5 w-[400px] h-[400px] bg-primary-container rounded-full mix-blend-multiply filter blur-[80px] opacity-60"></div>
<div class="orb absolute bottom-1/4 right-1/5 w-[450px] h-[450px] bg-secondary-container rounded-full mix-blend-multiply filter blur-[80px] opacity-50" style="animation-delay: -5s;"></div>
<main class="w-full max-w-md px-container-margin z-10 relative my-0">
<div class="glass-card rounded-[2rem] p-card-padding flex flex-col items-center">
<!-- Icon/Logo Area -->
<div class="w-20 h-20 rounded-2xl bg-white/70 backdrop-blur-xl flex items-center justify-center mb-8 shadow-[0_8px_16px_-4px_rgba(121,80,123,0.15)] border border-white/60">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: &quot;FILL&quot; 1;">assignment</span>
</div>
<!-- Branding & Heading -->
<h1 class="font-headline-md text-headline-md text-primary mb-2 tracking-[0.15em] font-bold uppercase text-sm tracking-wide">AssetFlow</h1>
<h2 class="font-headline-lg text-[36px] leading-tight text-on-surface mb-10 text-center tracking-tight font-extrabold drop-shadow-sm">Secure Login</h2>
<!-- Login Form -->
<form class="w-full space-y-6">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2 ml-1 font-medium tracking-wide" for="email">Email Address</label>
<div class="relative group">
<span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-primary">
<span class="material-symbols-outlined text-on-surface-variant/60 text-[22px] group-focus-within:text-primary">mail</span>
</span>
<input class="glass-input w-full rounded-xl pl-12 pr-4 py-3.5 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40" id="email" name="email" placeholder="james.wilson@enterprise.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2 ml-1 font-medium tracking-wide" for="password">Password</label>
<div class="relative group">
<span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-primary">
<span class="material-symbols-outlined text-on-surface-variant/60 text-[22px] group-focus-within:text-primary">lock</span>
</span>
<input class="glass-input w-full rounded-xl pl-12 pr-12 py-3.5 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-on-surface-variant/60 hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[22px]">visibility</span>
</button>
</div>
</div>
<!-- Actions: Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-6 px-1">
<label class="flex items-center gap-2.5 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-4.5 w-4.5 rounded border-outline/40 bg-white/50 text-primary focus:ring-primary focus:ring-offset-0 transition-colors cursor-pointer" type="checkbox">
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors font-medium">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-on-primary-container transition-colors font-bold" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full mt-10 btn-gradient text-on-primary font-label-md text-[16px] tracking-wide font-bold py-4 px-6 rounded-xl flex items-center justify-center gap-2 antialiased" type="submit">
                    LOGIN
                    <span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
</form>
<!-- Signup Link -->
<p class="mt-8 font-body-md text-body-md text-center font-medium text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-bold hover:text-on-primary-container transition-colors ml-1 underline underline-offset-4 decoration-primary/30 hover:decoration-primary" href="#">Signup</a>
</p>
</div>
</main>


</body></html>
