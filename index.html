<!-- STITCH_THREEJS_START:ANIMATION_159 class="absolute inset-0 w-full h-full object-cover" -->
<div class="absolute inset-0 w-full h-full object-cover" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_159" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_159');
  const devicePixelRatio = window.devicePixelRatio || 1;
  /**
 * Smart Finance - 3D Green Success Tick Scene
 * A high-fidelity, glossy 3D checkmark in a vibrant success green.
 */

let scene, camera, renderer, checkmark;
let animationFrameId;

function init() {
    const width = container.clientWidth || window.innerWidth;
    const height = container.clientHeight || 400;

    // Scene Setup
    scene = new THREE.Scene();

    // Camera Setup
    camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.z = 6;

    // Renderer Setup
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);

    const pointLight = new THREE.PointLight(0x22c55e, 1);
    pointLight.position.set(-5, -5, 2);
    scene.add(pointLight);

    // Build Professional Checkmark
    checkmark = new THREE.Group();

    const material = new THREE.MeshPhongMaterial({
        color: 0x22c55e, // Success Green
        shininess: 120,
        specular: 0x666666
    });

    // Short arm
    const shortArmGeom = new THREE.BoxGeometry(0.5, 1.4, 0.5);
    const shortArm = new THREE.Mesh(shortArmGeom, material);
    shortArm.position.set(-0.7, -0.3, 0);
    shortArm.rotation.z = Math.PI / 4;
    checkmark.add(shortArm);

    // Long arm
    const longArmGeom = new THREE.BoxGeometry(0.5, 2.8, 0.5);
    const longArm = new THREE.Mesh(longArmGeom, material);
    longArm.position.set(0.5, 0.3, 0);
    longArm.rotation.z = -Math.PI / 4;
    checkmark.add(longArm);

    scene.add(checkmark);

    // Subtle background halo
    const ringGeom = new THREE.TorusGeometry(2.2, 0.04, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.15 });
    const ring = new THREE.Mesh(ringGeom, ringMat);
    scene.add(ring);

    animate();
}

function animate() {
    animationFrameId = requestAnimationFrame(animate);

    const time = Date.now() * 0.0015;

    if (checkmark) {
        checkmark.rotation.y = Math.sin(time * 0.5) * 0.25;
        checkmark.position.y = Math.sin(time) * 0.15;
    }

    renderer.render(scene, camera);
}

function handleResize() {
    const width = container.clientWidth || window.innerWidth;
    const height = container.clientHeight || 400;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
}

window.addEventListener('resize', handleResize);

init();

// Cleanup
return () => {
    window.removeEventListener('resize', handleResize);
    cancelAnimationFrame(animationFrameId);
    if (renderer) {
        renderer.dispose();
    }
};

})();
</script>
