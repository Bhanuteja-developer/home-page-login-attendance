    function App() {
      // Load from local storage or use initial data
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('smartInventoryData');
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {
            return INITIAL_DATA;
          }
        }
        return INITIAL_DATA;
      });

      // History for Undo/Redo functionality
      const [past, setPast] = useState([]);
      const [future, setFuture] = useState([]);

      const [toastMessage, setToastMessage] = useState(null);
      // listeningState holds { categoryId, itemId, field }
      const [listeningState, setListeningState] = useState(null); 
      
      // Highlight selected row state
      const [selectedRow, setSelectedRow] = useState(null);

      // Custom Delete Confirmation Modal state
      const [itemToDelete, setItemToDelete] = useState(null);

      const [activeCategory, setActiveCategory] = useState('cat-1');

      const categoryNavItems = [
        { id: 'cat-1', name: 'Kirana', icon: Icons.ShoppingCart, color: 'text-orange-500' },
        { id: 'cat-2', name: 'Vegetables', icon: Icons.Vegetables, color: 'text-orange-500' },
        { id: 'cat-3', name: 'Mahoor', icon: Icons.Milk, color: 'text-orange-500' },
        { id: 'cat-4', name: 'Pooja', icon: Icons.Flame, color: 'text-orange-500' },
        { id: 'cat-5', name: 'Other', icon: Icons.Grid, color: 'text-orange-500' }
      ];

      const scrollToCategory = (categoryId) => {
        setActiveCategory(categoryId);
        const element = document.getElementById(categoryId);
        if (element) {
          element.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      };

      const recognitionRef = useRef(null);

      // Save to local storage whenever data changes
      useEffect(() => {
        localStorage.setItem('smartInventoryData', JSON.stringify(data));
      }, [data]);

      // Display toast messages safely instead of using alerts
      const showToast = (message) => {
        setToastMessage(message);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // Helper function to update data while recording history
      const updateData = (updaterFn) => {
        setData(prevData => {
          const nextData = updaterFn(prevData);
          setPast(prevPast => [...prevPast, prevData]);
          setFuture([]); // clear future on new action
          return nextData;
        });
      };

      const handleUndo = () => {
        if (past.length === 0) return;
        const previous = past[past.length - 1];
        setPast(past.slice(0, past.length - 1));
        setFuture([data, ...future]);
        setData(previous);
      };

      const handleRedo = () => {
        if (future.length === 0) return;
        const next = future[0];
        setFuture(future.slice(1));
        setPast([...past, data]);
        setData(next);
      };

      const toggleVoiceInput = (categoryId, itemId, field) => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
          showToast("Voice recognition is not supported in this browser. Please try Chrome or Safari.");
          return;
        }

        // If currently listening to THIS specific input, stop it.
        if (listeningState && listeningState.categoryId === categoryId && listeningState.itemId === itemId && listeningState.field === field) {
          if (recognitionRef.current) recognitionRef.current.stop();
          setListeningState(null);
          return;
        }

        // Stop any existing recognition before starting a new one
        if (recognitionRef.current) {
          recognitionRef.current.stop();
        }

        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US'; 

        recognition.onstart = () => {
          setListeningState({ categoryId, itemId, field });
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          handleVoiceResult(categoryId, itemId, field, transcript);
        };

        recognition.onerror = (event) => {
          console.error("Speech error:", event.error);
          setListeningState(null);
          if(event.error === 'not-allowed') {
             showToast("Microphone access denied. Please allow microphone permissions.");
          }
        };

        recognition.onend = () => {
          setListeningState(null);
        };

        recognitionRef.current = recognition;
        try {
          recognition.start();
        } catch (e) {
          console.error("Failed to start speech recognition", e);
          setListeningState(null);
        }
      };

      const handleVoiceResult = (categoryId, itemId, field, transcript) => {
        updateData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          return {
            ...category,
            items: category.items.map(item => {
              if (item.id !== itemId) return item;
              // Append voice text if input already has content, otherwise replace
              const currentValue = item[field] || '';
              const newValue = currentValue.trim().length > 0 
                ? `${currentValue} ${transcript}` 
                : transcript;
              return { ...item, [field]: newValue };
            })
          };
        }));
      };

      const handleInputChange = (categoryId, itemId, field, value) => {
        updateData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          return {
            ...category,
            items: category.items.map(item => {
              if (item.id !== itemId) return item;
              return { ...item, [field]: value };
            })
          };
        }));
      };

      const addRow = (categoryId) => {
        updateData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          const newItem = {
            id: `item-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
            name: '',
            quantity: ''
          };
          return { ...category, items: [...category.items, newItem] };
        }));
      };

      const insertRowAfter = (categoryId, index) => {
        updateData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          const newItem = {
            id: `item-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
            name: '',
            quantity: ''
          };
          const newItems = [...category.items];
          // Insert the new item right after the specified index
          newItems.splice(index + 1, 0, newItem);
          return { ...category, items: newItems };
        }));
      };

      const requestDeleteRow = (categoryId, itemId) => {
        setItemToDelete({ categoryId, itemId });
      };

      const confirmDeleteRow = () => {
        if (!itemToDelete) return;
        const { categoryId, itemId } = itemToDelete;
        updateData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          return {
            ...category,
            items: category.items.filter(item => item.id !== itemId)
          };
        }));
        setItemToDelete(null); // Close the modal
      };

      const checkIsListening = (categoryId, itemId, field) => {
        return listeningState?.categoryId === categoryId && 
               listeningState?.itemId === itemId && 
               listeningState?.field === field;
      };

      return (
        <div className="min-h-screen bg-[#FCF9F2] text-stone-800 font-sans pb-16">
          
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 bg-stone-800 text-white px-4 py-3 rounded-xl shadow-2xl text-sm transition-all text-center w-11/12 max-w-sm font-medium">
              {toastMessage}
            </div>
          )}

          {/* Delete Confirmation Modal Overlay */}
          {itemToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4 transition-opacity">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden border border-stone-100">
                <div className="p-6">
                  <h3 className="text-xl font-bold text-stone-800 mb-2">Delete Item?</h3>
                  <p className="text-stone-500 text-sm">Are you sure you want to remove this row? (You can undo this later).</p>
                </div>
                <div className="flex bg-[#FCF9F2] p-4 gap-3 justify-end border-t border-stone-100">
                  <button 
                    onClick={() => setItemToDelete(null)}
                    className="px-5 py-2 text-sm font-semibold text-stone-600 bg-white border border-stone-200 rounded-xl hover:bg-stone-50 transition-colors shadow-sm"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={confirmDeleteRow}
                    className="px-5 py-2 text-sm font-semibold text-white bg-gradient-to-r from-red-500 to-rose-500 rounded-xl hover:from-red-600 hover:to-rose-600 transition-colors shadow-sm shadow-red-500/30"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Main Header mimicking the design */}
          <div className="sticky top-0 z-40 shadow-sm border-b border-orange-100/50">
            <header className="bg-gradient-to-r from-orange-600 to-amber-500 text-white shadow-md relative z-20">
              <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                <div className="w-16 flex items-center">
                  <img src="https://cdn.wallpapersafari.com/15/40/zlOjX4.jpg" alt="Lord Dattatreya" className="h-11 w-11 rounded-full object-cover border-2 border-white/40 shadow-sm" />
                </div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl font-extrabold tracking-wide drop-shadow-sm">LDSS - Mahoor List</h1>
                </div>
                {/* Undo and Redo Controls */}
                <div className="flex items-center justify-end gap-1 w-16">
                  <button 
                    onClick={handleUndo} 
                    disabled={past.length === 0}
                    className={`p-2 rounded-xl transition-colors ${past.length === 0 ? 'text-white/30 cursor-not-allowed' : 'hover:bg-white/20 active:bg-white/30'}`}
                    title="Undo"
                  >
                    <Icons.Undo />
                  </button>
                  <button 
                    onClick={handleRedo} 
                    disabled={future.length === 0}
                    className={`p-2 rounded-xl transition-colors ${future.length === 0 ? 'text-white/30 cursor-not-allowed' : 'hover:bg-white/20 active:bg-white/30'}`}
                    title="Redo"
                  >
                    <Icons.Redo />
                  </button>
                </div>
              </div>
            </header>

            {/* Category Navigation Bar (Glassmorphism 2026 trend) */}
            <div className="max-w-4xl mx-auto px-4 py-3 bg-[#FCF9F2]/90 backdrop-blur-md relative z-10">
              <style>{`
                .scrollbar-hide::-webkit-scrollbar { display: none; }
                .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
              `}</style>
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-xs font-bold text-stone-400 uppercase tracking-widest">Category</h2>
                <button className="text-xs text-orange-600 font-bold hover:underline tracking-wide">See All</button>
              </div>
              <div className="flex gap-5 overflow-x-auto pb-1 scrollbar-hide snap-x px-1">
                {categoryNavItems.map(cat => (
                  <div 
                    key={cat.id} 
                    onClick={() => scrollToCategory(cat.id)}
                    className="flex flex-col items-center gap-2 cursor-pointer snap-start min-w-[72px]"
                  >
                    <div className={`w-14 h-14 rounded-full flex items-center justify-center transition-all duration-300 active:scale-90 ${activeCategory === cat.id ? 'bg-gradient-to-br from-orange-500 to-amber-500 text-white shadow-lg shadow-orange-500/40 border-0' : 'bg-white text-orange-400 border border-stone-200 shadow-sm'}`}>
                      <cat.icon className="w-6 h-6" />
                    </div>
                    <span className={`text-[11px] font-bold tracking-wide transition-colors ${activeCategory === cat.id ? 'text-orange-600' : 'text-stone-400'}`}>
                      {cat.name}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <main className="max-w-4xl mx-auto p-3 sm:p-4 mt-2 space-y-8">
            
            {data.map((category) => (
              <div 
                key={category.id} 
                id={category.id}
                className="bg-white rounded-2xl shadow-sm shadow-orange-900/5 border border-orange-100/60 overflow-hidden scroll-mt-[190px]"
              >
                
                {/* Category Header */}
                <div className="bg-gradient-to-r from-orange-500 to-amber-500 text-white px-4 py-3 relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
                  <h2 className="text-lg font-bold text-center tracking-wide drop-shadow-sm">{category.title}</h2>
                </div>

                {/* Table Headers */}
                <div className="flex bg-orange-50 text-orange-800 text-[11px] font-extrabold tracking-widest px-2 py-2.5 border-b border-orange-100/80">
                  <div className="w-8 text-center">NO</div>
                  <div className="flex-1 text-center border-l border-orange-200/60 pl-2">ITEMS</div>
                  <div className="w-24 sm:w-32 text-center border-l border-orange-200/60 pl-2">QUANTITY</div>
                  <div className="w-16 text-center border-l border-orange-200/60"></div>
                </div>

                {/* Items List */}
                <div className="divide-y divide-stone-100/80">
                  {category.items.length === 0 ? (
                    <div className="p-6 text-center text-stone-400 text-sm font-medium">No items in this category.</div>
                  ) : (
                    category.items.map((item, index) => (
                      <div 
                        key={item.id} 
                        onClick={() => setSelectedRow({ categoryId: category.id, itemId: item.id })}
                        className={`flex items-start px-1 py-2.5 transition-colors cursor-pointer ${selectedRow?.categoryId === category.id && selectedRow?.itemId === item.id ? 'bg-amber-50/70' : 'hover:bg-[#FCF9F2]'}`}
                      >
                        
                        {/* Auto-sorted S.No based on index */}
                        <div className="w-8 flex items-center justify-center text-sm text-stone-400 font-semibold pt-1.5">
                          {index + 1}
                        </div>

                        {/* Items Input */}
                        <div className="flex-1 px-1 sm:px-2 relative">
                          <input 
                            type="text"
                            value={item.name}
                            onChange={(e) => handleInputChange(category.id, item.id, 'name', e.target.value)}
                            placeholder="Item name"
                            className="w-full bg-transparent border-none text-sm font-medium text-stone-800 placeholder-stone-300 focus:outline-none focus:ring-0 pr-8 py-1.5"
                          />
                          <button 
                            onClick={(e) => { e.stopPropagation(); toggleVoiceInput(category.id, item.id, 'name'); }}
                            className="absolute right-3 sm:right-4 top-1/2 transform -translate-y-1/2 text-stone-300 hover:text-orange-500 p-1 transition-colors"
                            aria-label="Voice input for item name"
                          >
                            {checkIsListening(category.id, item.id, 'name') ? <Icons.MicActive /> : <Icons.Mic />}
                          </button>
                        </div>

                        {/* Quantity Input */}
                        <div className="w-24 sm:w-32 px-1 relative">
                          <input 
                            type="text"
                            value={item.quantity}
                            onChange={(e) => handleInputChange(category.id, item.id, 'quantity', e.target.value)}
                            placeholder="Qty"
                            className="w-full bg-transparent border-none text-sm font-medium text-stone-800 placeholder-stone-300 focus:outline-none focus:ring-0 pr-7 py-1.5"
                          />
                           <button 
                            onClick={(e) => { e.stopPropagation(); toggleVoiceInput(category.id, item.id, 'quantity'); }}
                            className="absolute right-2 sm:right-3 top-1/2 transform -translate-y-1/2 text-stone-300 hover:text-orange-500 p-0.5 transition-colors"
                            aria-label="Voice input for quantity"
                          >
                            {checkIsListening(category.id, item.id, 'quantity') ? <Icons.MicActive className="w-3.5 h-3.5" /> : <Icons.Mic className="w-3.5 h-3.5" />}
                          </button>
                        </div>

                        {/* Action Buttons (Insert & Delete) */}
                        <div className="w-16 flex items-center justify-evenly pt-1.5 px-1">
                          <button 
                            onClick={(e) => { e.stopPropagation(); insertRowAfter(category.id, index); }}
                            className="text-stone-300 hover:text-orange-500 transition-colors p-1"
                            title="Insert row below"
                          >
                            <Icons.Plus className="w-4 h-4" />
                          </button>
                          <button 
                            onClick={(e) => { e.stopPropagation(); requestDeleteRow(category.id, item.id); }}
                            className="text-stone-300 hover:text-red-400 transition-colors p-1"
                            title="Delete row"
                          >
                            <Icons.Trash className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {/* Add Item Button (+) */}
                <div className="bg-[#FCF9F2]/50 p-3 flex justify-center">
                  <button 
                    onClick={() => addRow(category.id)}
                    className="flex items-center gap-1.5 text-sm font-bold text-orange-600 bg-orange-100/50 hover:bg-orange-100 px-5 py-2.5 rounded-full transition-colors w-full justify-center sm:w-auto shadow-sm"
                  >
                    <Icons.Plus className="w-4 h-4" /> Add New Detail
                  </button>
                </div>
                
              </div>
            ))}
            
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
