<style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-lg antialiased h-screen flex flex-col overflow-hidden selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-inverse-surface w-full top-0 sticky border-b border-outline-variant dark:border-outline flat no shadows flex items-center px-md h-16 w-full max-w-container-max mx-auto z-40 flex-shrink-0">
<button aria-label="Go back" class="mr-sm p-2 rounded-full hover:bg-surface-container transition-colors active:scale-95 duration-150 flex items-center justify-center text-primary dark:text-inverse-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary dark:text-inverse-primary" style="font-variation-settings: 'FILL' 1;">memory</span>
<h1 class="font-headline-md text-headline-md font-semibold text-primary dark:text-inverse-primary">RAM Configuration</h1>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto no-scrollbar px-md py-lg w-full max-w-md mx-auto flex flex-col gap-lg pb-32">
<!-- Descriptive Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-[0_4px_6px_-1px_rgb(0,0,0,0.1)]">
<div class="flex items-start gap-sm">
<span class="material-symbols-outlined text-tertiary mt-1 text-[20px]">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
                    Select the number of RAM slots and enter the capacity for each to calculate your system's total memory allocation.
                </p>
</div>
</div>
<!-- Stick Selection -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-secondary" for="stickCount">NUMBER OF STICKS</label>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-sm py-sm font-body-lg text-on-surface focus:border-primary focus:ring-2 focus:ring-primary-container/30 transition-all outline-none appearance-none" id="stickCount">
<option value="1">1 Stick</option>
<option value="2">2 Sticks</option>
<option value="3">3 Sticks</option>
<option selected="" value="4">4 Sticks</option>
</select>
</div>
<!-- Input Grid -->
<section class="grid grid-cols-2 gap-md" id="inputGrid">
<!-- Slots will be injected here via JS -->
</section>
<!-- Total RAM Display -->
<div class="mt-sm bg-[#EFF6FF] border-l-2 border-primary rounded-xl p-lg relative overflow-hidden flex flex-col gap-md">
<!-- Decorative Background Element -->
<div class="absolute -right-6 -bottom-6 opacity-[0.03] pointer-events-none">
<span class="material-symbols-outlined text-[120px]">memory</span>
</div>
<div class="flex justify-between items-start relative z-10 w-full">
<div class="flex flex-col gap-xs">
<span class="font-label-caps text-label-caps text-primary uppercase tracking-wider">Total System Memory</span>
<div class="flex items-baseline gap-xs">
<span class="font-display-metrics text-display-metrics text-on-surface font-bold text-[#004ac6]" id="totalRamDisplay">0</span>
<span class="font-headline-md text-headline-md text-secondary">GB</span>
</div>
</div>
<div class="bg-primary-container/10 px-2 py-1 rounded border border-primary-container/20 flex items-center gap-1">
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></div>
<span class="font-label-caps text-label-caps text-primary text-[10px]">REAL-TIME</span>
</div>
</div>
<!-- Summary Details -->
<div class="relative z-10 flex flex-col gap-2 w-full pt-4 border-t border-primary/20">
<div class="flex justify-between items-center w-full">
<span class="font-body-sm text-body-sm text-secondary font-medium">No. of Sticks</span>
<span class="font-body-sm text-body-sm text-on-surface font-bold" id="summarySticks">4</span>
</div>
<div class="flex flex-col gap-1 w-full mt-1" id="summaryDetailsList">
<!-- Summary items will be injected here -->
</div>
</div>
</div>
<div class="flex-1"></div> <!-- Spacer to push button to bottom -->
<!-- Actions -->
<div class="mt-xl">
<button class="w-full bg-primary hover:bg-[#003ea8] active:scale-[0.98] text-on-primary font-headline-md text-headline-md py-sm rounded-lg shadow-sm transition-all flex items-center justify-center gap-sm h-12">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">save</span>
                Save Details
            </button>
</div>
</main>
<!-- BottomNavBar (Hidden on this transactional screen as per instructions) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const stickCountSelect = document.getElementById('stickCount');
            const inputGrid = document.getElementById('inputGrid');
            const totalDisplay = document.getElementById('totalRamDisplay');
            const summarySticks = document.getElementById('summarySticks');
            const summaryDetailsList = document.getElementById('summaryDetailsList');

            // Initial render
            renderInputs();

            stickCountSelect.addEventListener('change', renderInputs);

            function renderInputs() {
                const count = parseInt(stickCountSelect.value);
                summarySticks.textContent = count;
                
                // Clear existing inputs
                inputGrid.innerHTML = '';
                
                // Generate new inputs
                for (let i = 1; i <= count; i++) {
                    const div = document.createElement('div');
                    div.className = 'flex flex-col gap-xs';
                    div.innerHTML = `
                        <label class="font-label-caps text-label-caps text-secondary" for="stick${i}">STICK - ${i} (GB)</label>
                        <div class="relative">
                            <input class="ram-input w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-sm py-sm font-code-mono text-code-mono text-on-surface focus:border-primary focus:ring-2 focus:ring-primary-container/30 transition-all outline-none" id="stick${i}" min="0" placeholder="0" step="1" type="number" data-stick="${i}"/>
                            <span class="absolute right-sm top-1/2 -translate-y-1/2 font-code-mono text-code-mono text-outline pointer-events-none">GB</span>
                        </div>
                    `;
                    inputGrid.appendChild(div);
                }

                // Re-attach listeners to new inputs
                const newInputs = document.querySelectorAll('.ram-input');
                newInputs.forEach(input => {
                    input.addEventListener('input', calculateTotal);
                    input.addEventListener('keydown', (e) => {
                        if(e.key === '-' || e.key === 'e') {
                            e.preventDefault();
                        }
                    });
                });
                
                // Recalculate based on new inputs (initially empty)
                calculateTotal();
            }

            function calculateTotal() {
                const inputs = document.querySelectorAll('.ram-input');
                let total = 0;
                let summaryHTML = '';

                inputs.forEach(input => {
                    const val = parseFloat(input.value);
                    const stickNum = input.getAttribute('data-stick');
                    const displayVal = (!isNaN(val) && val > 0) ? val : 0;
                    
                    if (!isNaN(val) && val > 0) {
                        total += val;
                    }

                    summaryHTML += `
                        <div class="flex justify-between items-center w-full">
                            <span class="font-body-sm text-body-sm text-secondary">Stick ${stickNum} Size</span>
                            <span class="font-body-sm text-body-sm text-on-surface font-medium">${displayVal}GB</span>
                        </div>
                    `;
                });
                
                summaryDetailsList.innerHTML = summaryHTML;
                
                // Animate value change slightly
                totalDisplay.style.opacity = '0.5';
                setTimeout(() => {
                    totalDisplay.textContent = total;
                    totalDisplay.style.opacity = '1';
                }, 100);
            }
        });
    </script>
</body></html>
