<script>
    // Clean Digital Clock
    function updateTacticalClock() {
        const now = new Date();
        
        // Time
        let hours = now.getHours();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12; // the hour '0' should be '12'
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('tactical-time').textContent = `${hours}:${minutes} ${ampm}`;
        
        // Date
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const dayName = days[now.getDay()];
        const day = String(now.getDate()).padStart(2, '0');
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const month = months[now.getMonth()];
        const year = now.getFullYear();
        document.getElementById('tactical-date').textContent = `${dayName}, ${day} ${month} ${year}`;
        
        setTimeout(updateTacticalClock, 1000); // Update every second
    }
    updateTacticalClock();

    // Simulated Biometric Scan Flow (Clean Version)
    function startScanFlow() {
        const icon = document.getElementById('scan-icon');
        const status = document.getElementById('scan-status');
        const title = document.getElementById('scan-title');
        const container = document.getElementById('scanner-container');
        
        status.textContent = 'Processing biometric data...';
        title.textContent = 'Authenticating';
        icon.className = 'material-symbols-outlined text-4xl text-primary animate-pulse';
        
        setTimeout(() => {
            status.textContent = 'Identity confirmed';
            title.textContent = 'Authenticated';
            title.classList.add('text-success');
            icon.textContent = 'check_circle';
            icon.className = 'material-symbols-outlined text-4xl text-success';
            
            setTimeout(() => {
                resetScanFlow();
            }, 3000);
        }, 2000);
    }

    function resetScanFlow() {
        const icon = document.getElementById('scan-icon');
        const status = document.getElementById('scan-status');
        const title = document.getElementById('scan-title');
        
        status.textContent = 'Tap to authenticate for secure operations';
        title.textContent = 'Biometric Authentication';
        title.classList.remove('text-success');
        icon.textContent = 'fingerprint';
        icon.className = 'material-symbols-outlined text-4xl text-primary-container';
    }

    function initiateClockIn() {
        startScanFlow();
    }
</script>
