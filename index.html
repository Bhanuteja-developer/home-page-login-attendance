<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Edit Category Limit</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                        "on-primary-fixed": "#1f005f",
                        "surface-container-low": "#f6f3f2",
                        "outline": "#7a7487",
                        "inverse-primary": "#cdbdff",
                        "surface-container-highest": "#e5e2e1",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#ffdbd1",
                        "inverse-surface": "#313030",
                        "secondary-container": "#fd6a3c",
                        "tertiary-fixed": "#ecdcff",
                        "primary-fixed": "#e7deff",
                        "on-background": "#1c1b1b",
                        "background": "#fcf9f8",
                        "on-secondary-container": "#5f1600",
                        "secondary-fixed-dim": "#ffb59f",
                        "on-surface": "#1c1b1b",
                        "on-primary-fixed-variant": "#4e00d1",
                        "secondary": "#ae3203",
                        "tertiary-fixed-dim": "#d6baff",
                        "on-secondary-fixed": "#3a0a00",
                        "surface-container": "#f0eded",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#862300",
                        "outline-variant": "#cac3d8",
                        "on-tertiary": "#ffffff",

                        "surface-dim": "#dcd9d9",
                        "on-surface-variant": "#494456",
                        "on-tertiary-fixed": "#280057",
                        "primary-fixed-dim": "#cdbdff",
                        "tertiary-container": "#8d4aee",
                        "inverse-on-surface": "#f3f0ef",
                        "surface": "#fcf9f8",
                        "primary": "#622ce5",
                        "on-primary-container": "#fcf6ff",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#6733ea",
                        "surface-bright": "#fcf9f8",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#fdf6ff",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "container-margin": "20px",
                        "lg": "24px",
                        "gutter": "16px",
                        "xl": "32px",
                        "md": "16px",
                        "sm": "8px",
                        "xs": "4px",
                        "unit": "4px"
                    },
                    fontFamily: {
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-data": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    fontSize: {
                        "label-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }],
                        "label-md": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }],
                        "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "display-data": ["48px", { lineHeight: "56px", letterSpacing: "-0.04em", fontWeight: "700" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", letterSpacing: "-0.02em", fontWeight: "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        .gradient-text {
            background: linear-gradient(135deg, #7B4DFF, #FF6B3D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #7B4DFF, #FF6B3D);
        }
        
        /* Animation for sliding up */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body-md text-on-background antialiased h-screen w-full relative flex justify-center overflow-y-auto">
<!-- Background Screen Context (Dimmed) -->
<div class="absolute inset-0 z-0">
<img alt="Background Screen" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBNXYzu_uKMlvQdEqzoimqa60hmY_ioEIhh9wtKM34JxyWxo10e4dbHW_1pM64-VmBiqsv0RFb9MMDOdV6nIpF9x5WBuNjBBgUWv5rl8YW85Xo2rzDsNdp9A594QDKj0DgNMTpR7cTp_RXYpKNr6dh9CWlorso5Mmq2VeglUXWnhbiSIYAjNOlv7Qiq_vrrbkSsvjEuC8ku6Ju1jgwTSIQVI3eZ5_hZIW2o3Hc4kPz6CIDCyzXBcF3_">
</div>
<!-- Overlay / Dimmer -->
<div aria-hidden="true" class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-sm z-10 animate-fade-in"></div>
<!-- Bottom Sheet Container -->
<div class="absolute bottom-0 w-full max-w-md bg-surface/90 dark:bg-surface-container-low/90 backdrop-blur-2xl rounded-t-[24px] shadow-[0px_-10px_40px_rgba(0,0,0,0.1)] z-20 flex flex-col animate-slide-up pb-safe" style="max-height: 92vh;">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-md pb-sm cursor-grab active:cursor-grabbing">
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
</div>
<!-- Header -->
<div class="flex justify-between items-center px-lg pb-md border-b border-outline-variant/20">
<h2 class="font-headline-md text-headline-md text-on-surface">Edit Category Limit</h2>
<button aria-label="Close" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface transition-colors">close</span>
</button>
</div>
<div class="overflow-y-auto px-lg py-xl flex-1 flex flex-col gap-xl" style="padding-bottom: 40px; overscroll-behavior: contain;">
<!-- Category Context -->
<div class="flex items-center gap-md">
<div class="w-16 h-16 rounded-2xl bg-tertiary-container/20 flex items-center justify-center shadow-[0px_4px_12px_rgba(141,74,238,0.1)]">
<span class="material-symbols-outlined text-tertiary text-3xl fill" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface">Vegetables</h3>
<p class="font-label-md text-label-md text-on-surface-variant mt-xs">Monthly Cycle</p>
</div>
</div>
<!-- Current Limit & Progress -->
<div class="bg-surface-container-low rounded-2xl p-lg shadow-[0px_10px_30px_rgba(0,0,0,0.04)] border border-white/50 relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-[#7B4DFF]/10 to-[#FF6B3D]/10"></div>
<p class="font-label-md text-label-md text-on-surface-variant mb-xs">Current Limit</p>
<div class="font-display-data text-display-data text-on-surface">₹2,500</div>
<div class="mt-lg">
<div class="flex justify-between font-label-sm text-label-sm mb-sm">
<span class="text-on-surface-variant">Spent <span class="text-on-surface font-semibold">₹2,000</span></span>
<span class="text-on-surface-variant">Remaining <span class="text-secondary font-semibold">₹500</span></span>
</div>
<!-- Progress Bar Track -->
<div class="w-full h-3 bg-surface-variant rounded-full overflow-hidden relative shadow-inner">
<!-- Progress Fill -->
<div class="h-full gradient-bg rounded-full absolute left-0 top-0 shadow-[0px_0px_10px_rgba(123,77,255,0.4)] transition-all duration-1000 ease-out" style="width: 80%;"></div>
</div>
<div class="text-right mt-xs">
<span class="font-label-sm text-label-sm text-outline font-semibold">80% Used</span>
</div>
</div>
</div>
<!-- Edit Input Section -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="new-limit">New Monthly Limit</label>
<div class="relative flex items-center">
<span class="absolute left-lg font-headline-md text-headline-md text-on-surface-variant pointer-events-none">₹</span>
<input class="w-full h-[56px] pl-[48px] pr-lg bg-[#F8F9FA] rounded-[18px] border border-outline-variant/30 font-headline-md text-headline-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm" id="new-limit" inputmode="numeric" type="number" value="2500">
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-xs">Recommended: ₹2,800 based on past 3 months average.</p>
</div>
</div>
<!-- Action Area -->
<div class="p-lg border-t border-outline-variant/20 bg-surface/50 backdrop-blur-md">
<button class="w-full h-[48px] rounded-[18px] gradient-bg text-on-primary font-label-md text-label-md shadow-[0px_20px_40px_rgba(123,77,255,0.15)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm">
                Update Limit
                <span class="material-symbols-outlined text-[20px]">check_circle</span>
</button>
</div>
</div>


</body></html>
