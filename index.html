<style>
        .glass-card-premium {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        .glass-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.4) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .gradient-text {
            background: linear-gradient(to right, #7B4DFF, #FF6B3D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-btn {
            background: linear-gradient(135deg, #7B4DFF 0%, #FF6B3D 100%);
        }
        .btn-glow {
            box-shadow: 0 10px 25px -5px rgba(123, 77, 255, 0.5), 0 8px 10px -6px rgba(255, 107, 61, 0.5);
        }
    </style>

<body class="text-on-background min-h-screen font-body-md selection:bg-primary-container selection:text-on-primary-container bg-surface-container-lowest"><div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-40"><div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/10 blur-[120px]"></div><div class="absolute top-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-secondary-container/10 blur-[120px]"></div><div class="absolute -bottom-[10%] left-[20%] w-[60%] h-[60%] rounded-full bg-tertiary-container/5 blur-[120px]"></div></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-transparent px-container-margin py-sm flex justify-between items-center h-16">
<button class="w-10 h-10 flex items-center justify-center hover:bg-surface-variant/50 rounded-full transition-colors text-on-surface">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-on-surface">Set Threshold</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-32 max-w-2xl mx-auto flex flex-col gap-xl px-2">
<!-- Description -->
<p class="text-body-md font-body-md text-on-surface-variant text-center px-4">
            Define your daily spending limit. Days exceeding this threshold will be highlighted in your analysis calendar.
        </p>
<!-- Input Card -->
<section class="w-full rounded-2xl p-lg bg-surface-container-lowest border border-outline-variant/30 shadow-sm flex flex-col items-center justify-center min-h-[200px]" style="box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); border: 1px solid rgba(0, 0, 0, 0.05);">
<div class="flex items-center justify-center w-full">
<span class="text-7xl font-bold text-primary opacity-40 mr-2 leading-none">₹</span>
<input class="bg-transparent border-none text-center text-[72px] font-bold text-on-surface focus:ring-0 p-0 w-48 leading-none" id="threshold-input" placeholder="0" style="outline: none;" type="number" value="0">
</div>
<!-- Quick Select Chips -->
</section>
<!-- Visual Alert Preview -->
<section class="flex flex-col gap-sm">
<h2 class="text-label-md font-label-md text-on-surface-variant px-2">Visual Alert Preview</h2>
<div class="w-full rounded-2xl p-lg bg-surface-container-lowest border border-outline-variant/30 shadow-sm flex items-center justify-between" style="box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); border: 1px solid rgba(0, 0, 0, 0.05);">
<div class="flex flex-col">
<span class="text-body-md font-body-md text-on-surface">When spending exceeds <span class="font-bold">₹500</span></span>
<span class="text-label-sm font-label-sm text-on-surface-variant">Calendar view</span>
</div>
<!-- Mock Calendar Cell -->
<div class="w-16 h-16 rounded-xl bg-error-container border border-error/20 flex flex-col items-center justify-center shadow-sm">
<span class="text-label-sm font-label-sm text-on-error-container/70">Mon</span>
<span class="text-headline-md font-headline-md font-bold text-on-error-container">14</span>
</div>
</div>
</section>
<!-- Spacer to push button to bottom on mobile -->
<div class="flex-grow"></div>
<!-- Primary Action -->
<div class="mt-8">
<button class="w-full h-14 rounded-btn gradient-btn btn-glow text-on-primary text-label-md font-label-md font-bold hover:opacity-95 transition-opacity flex items-center justify-center gap-2">
                Save Threshold
                <span class="material-symbols-outlined" data-icon="check">check</span>
</button>
</div>
</main>
<!-- Navigation Suppressed as this is a transactional sub-page with a 'Back' action -->
<script>
        // Simple interaction for chips
        document.querySelectorAll('.flex.gap-md button').forEach(btn => {
            btn.addEventListener('click', function() {
                // Reset all to secondary style
                document.querySelectorAll('.flex.gap-md button').forEach(b => {
                    b.className = 'px-md py-sm rounded-full bg-input-bg border border-outline-variant text-label-md font-label-md hover:bg-surface-variant transition-colors';
                });
                // Set clicked to primary style
                this.className = 'px-md py-sm rounded-full bg-primary-container text-on-primary-container text-label-md font-label-md shadow-sm transition-colors';
            });
        });
    </script>
