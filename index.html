<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - Smart Finance</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #622ce5;
        --primary-hover: #4e00d1;
        --surface: #FCF9F8;
        --surface-card: #FFFFFF;
        --on-surface: #1c1b1b;
        --on-surface-variant: #494456;
        --outline-variant: #cac3d8;
        --input-bg: #F8F9FA;
        --accent: #fd6a3c;
        --error: #ba1a1a;
        
        --font-family: 'Inter', sans-serif;
        
        --spacing-xs: 4px;
        --spacing-sm: 8px;
        --spacing-md: 16px;
        --spacing-lg: 24px;
        --spacing-xl: 32px;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: var(--font-family);
        background-color: var(--surface);
        color: var(--on-surface);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Layout */
    .page-wrapper {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .top-gradient {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 45vh;
        background: linear-gradient(135deg, #7B4DFF 0%, #FF6B3D 100%);
        z-index: 0;
        border-bottom-left-radius: 24px;
        border-bottom-right-radius: 24px;
    }

    .content-container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 480px;
        padding: var(--spacing-xl) var(--spacing-md);
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 2vh;
    }

    /* Header */
    .header {
        text-align: center;
        color: #ffffff;
        margin-bottom: var(--spacing-xl);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .logo-box {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: var(--spacing-md);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .logo-box .material-symbols-outlined {
        font-size: 32px;
        color: #ffffff;
    }

    .header h1 {
        font-size: 24px;
        font-weight: 700;
        line-height: 32px;
        letter-spacing: -0.02em;
        margin-bottom: var(--spacing-xs);
    }

    @media (min-width: 768px) {
        .header h1 {
            font-size: 32px;
            line-height: 40px;
        }
    }

    .header p {
        font-size: 16px;
        font-weight: 400;
        line-height: 24px;
        color: rgba(255, 255, 255, 0.9);
    }

    /* Card */
    .card {
        background-color: var(--surface-card);
        border-radius: 24px;
        padding: var(--spacing-xl) var(--spacing-lg);
        width: 100%;
        box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.08);
    }

    /* Form Elements */
    .form-group {
        margin-bottom: var(--spacing-md);
    }

    .form-label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        line-height: 16px;
        color: var(--on-surface-variant);
        margin-bottom: var(--spacing-sm);
    }

    .form-label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--spacing-sm);
    }

    .form-label-row .form-label {
        margin-bottom: 0;
    }

    .forgot-link {
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        text-decoration: none;
        transition: color 0.2s;
    }

    .forgot-link:hover {
        color: #e55a2b;
    }

    .input-wrapper {
        position: relative;
    }

    .input-icon-left {
        position: absolute;
        left: var(--spacing-md);
        top: 50%;
        transform: translateY(-50%);
        color: var(--outline-variant);
    }

    .input-icon-right {
        position: absolute;
        right: var(--spacing-md);
        top: 50%;
        transform: translateY(-50%);
        color: var(--outline-variant);
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
    }

    .input-icon-right:hover {
        color: var(--on-surface);
    }

    .form-input {
        width: 100%;
        height: 56px;
        padding-left: 48px;
        padding-right: var(--spacing-md);
        background-color: var(--input-bg);
        border: 1px solid var(--outline-variant);
        border-radius: 8px;
        font-family: var(--font-family);
        font-size: 16px;
        color: var(--on-surface);
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input.has-right-icon {
        padding-right: 48px;
    }

    .form-input::placeholder {
        color: var(--outline-variant);
    }

    .form-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 1px var(--primary);
    }

    .checkbox-wrapper {
        display: flex;
        align-items: center;
        margin-top: var(--spacing-sm);
        margin-bottom: var(--spacing-xl);
    }

    .checkbox-input {
        width: 20px;
        height: 20px;
        accent-color: var(--primary);
        cursor: pointer;
    }

    .checkbox-label {
        margin-left: var(--spacing-sm);
        font-size: 16px;
        color: var(--on-surface-variant);
        cursor: pointer;
    }

    .btn-submit {
        width: 100%;
        height: 48px;
        background-color: var(--primary);
        color: #ffffff;
        border: none;
        border-radius: 18px;
        font-family: var(--font-family);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
        background-color: var(--primary-hover);
    }

    .btn-submit:active {
        transform: scale(0.98);
    }

    /* Divider */
    .divider {
        display: flex;
        align-items: center;
        margin: var(--spacing-xl) 0;
    }

    .divider-line {
        flex-grow: 1;
        height: 1px;
        background-color: var(--outline-variant);
        opacity: 0.5;
    }

    .divider-text {
        margin: 0 var(--spacing-md);
        font-size: 12px;
        font-weight: 500;
        color: var(--on-surface-variant);
    }

    /* Footer */
    .footer-text {
        text-align: center;
        font-size: 16px;
        color: var(--on-surface-variant);
        margin-top: var(--spacing-lg);
    }

    .footer-link {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
        margin-left: var(--spacing-xs);
        transition: color 0.2s;
    }

    .footer-link:hover {
        color: var(--primary-hover);
    }
</style>
</head>
<body>
<div class="page-wrapper">
<!-- Top Gradient Background -->
<div class="top-gradient"></div>
<div class="content-container">
<!-- Logo Header -->
<div class="header">
<div class="logo-box"><span class="material-symbols-outlined">account_balance_wallet</span></div>
<h1 class="">Smart Finance</h1>

</div>
<!-- Login Card -->
<div class="card">
<form action="#" method="POST">
<!-- Email Input -->
<div class="form-group">
<label class="form-label" for="email">Email Address or Mobile Number</label>
<div class="input-wrapper">
<span class="material-symbols-outlined input-icon-left">person</span>
<input class="form-input" id="email" name="email" placeholder="Enter your email or 10-digit number" required="" type="text">
</div>
</div>
<!-- Password Input -->
<div class="form-group">
<div class="form-label-row">
<label class="form-label" for="password">Password</label>
<a class="forgot-link" href="#">Forgot Password?</a>
</div>
<div class="input-wrapper">
<span class="material-symbols-outlined input-icon-left">lock</span>
<input class="form-input has-right-icon" id="password" name="password" placeholder="Enter your password" required="" type="password">
<button aria-label="Toggle password visibility" class="input-icon-right" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="checkbox-wrapper">
<input class="checkbox-input" id="remember" name="remember" type="checkbox">
<label class="checkbox-label" for="remember">Remember me on this device</label>
</div>
<!-- Submit Button -->
<button class="btn-submit" type="submit">
                    Secure Login
                </button>
</form>
<!-- Divider -->
<div class="divider">
<div class="divider-line"></div>
<span class="divider-text">or</span>
<div class="divider-line"></div>
</div>
<!-- Footer Links inside card for better containment -->
<div class="footer-text">
                Don't have an account? 
                <a class="footer-link" href="#">Sign up now</a>
</div>
</div>
</div>
</div>
<script>
    // Simple password toggle logic
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.querySelector('button[aria-label="Toggle password visibility"]');
        const passwordInput = document.getElementById('password');
        const icon = toggleBtn.querySelector('.material-symbols-outlined');

        if(toggleBtn && passwordInput && icon) {
            toggleBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.textContent = 'visibility';
                    icon.style.color = 'var(--primary)';
                } else {
                    passwordInput.type = 'password';
                    icon.textContent = 'visibility_off';
                    icon.style.color = '';
                }
            });
        }
    });
</script>


</body></html>
