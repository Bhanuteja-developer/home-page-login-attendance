<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liveness & Distance Capture</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        #camera-container {
            transition: border-color 0.3s ease-in-out, box-shadow 0.3s ease-in-out, opacity 0.3s ease;
        }
        .border-red {
            border-color: #ef4444 !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
        .border-green {
            border-color: #22c55e !important;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }
        #video-feed, #output-canvas {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="bg-black text-white w-screen h-screen overflow-hidden m-0 p-0 flex justify-center items-center">

    <!-- Full Screen Camera Container -->
    <div id="camera-container" class="relative w-full h-full border-8 border-red box-border overflow-hidden bg-black flex items-center justify-center">
        
        <video id="video-feed" class="absolute w-full h-full object-cover hidden" playsinline autoplay></video>
        <canvas id="output-canvas" class="absolute w-full h-full object-cover"></canvas>

        <!-- Loading overlay -->
        <div id="loading" class="absolute z-20 flex flex-col items-center bg-black/80 w-full h-full justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white mb-2"></div>
            <span>Loading AI Models...</span>
        </div>

        <!-- Analyzing overlay -->
        <div id="analyzing-overlay" class="absolute z-20 flex flex-col items-center bg-black/80 w-full h-full justify-center hidden">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-2"></div>
            <span class="text-xl font-bold mt-2">Analyzing with Google AI...</span>
        </div>

        <!-- Success Pop-up -->
        <div id="success-popup" class="absolute z-30 flex flex-col items-center bg-green-600/95 text-white w-full h-full justify-center hidden backdrop-blur-md">
            <svg class="w-24 h-24 mb-4 text-white animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-3xl font-bold text-center px-4">Attendance Submitted!</span>
            <span class="text-lg mt-2 text-green-100">You can now close this window.</span>
        </div>

        <!-- On-Screen Instructions -->
        <div id="feedback-badge" class="absolute top-10 left-1/2 transform -translate-x-1/2 w-[90%] max-w-md text-center bg-red-600 text-white px-6 py-4 rounded-2xl font-bold text-xl shadow-2xl transition-colors duration-300 backdrop-blur-md z-10 border border-white/20">
            Aligning Face...
        </div>

        <!-- Distance and Status indicators -->
        <div class="absolute bottom-10 left-1/2 transform -translate-x-1/2 flex flex-col items-center gap-3 w-full z-10">
            <div id="liveness-status" class="bg-gray-900/80 text-yellow-400 px-6 py-2 rounded-full font-bold text-lg shadow-lg backdrop-blur-md border border-gray-700 animate-pulse">
                Waiting for Face...
            </div>
            <div id="distance-display" class="bg-black/70 text-white px-4 py-1 rounded-md font-mono text-sm shadow-md border border-gray-600 backdrop-blur-sm">
                Distance: -- cm
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video-feed');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const cameraContainer = document.getElementById('camera-container');
        const feedbackBadge = document.getElementById('feedback-badge');
        const distanceDisplay = document.getElementById('distance-display');
        const loadingOverlay = document.getElementById('loading');
        const livenessStatus = document.getElementById('liveness-status');

        // --- UPDATED CALIBRATION THRESHOLD ---
        const MIN_DISTANCE_CM = 55; // Blocks <= 54, allows >= 55
        
        const FOCAL_FACTOR = 13.0; 

        // Blink, Anti-shake & Smile Constants
        const EAR_THRESHOLD = 0.22;
        const EAR_OPEN_THRESHOLD = 0.25;
        const SHAKE_THRESHOLD = 0.03; 
        const MIN_FRAMES_CLOSED = 2;  
        const MAX_FRAMES_CLOSED = 15; 
        const SMILE_THRESHOLD = 0.42; 

        let isDistanceOptimal = false;
        let isLivenessVerified = false; 
        let isEyesClosed = false;
        let previousNosePos = null;
        let framesEyesClosed = 0;
        let livenessStage = 'blink'; // Sequence: 'blink' -> 'smile' -> 'hand' -> 'verified'
        let currentHandLandmarks = null; 
        let isCapturing = false; // Prevents multiple auto-captures

        function euclideanDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function calculateEAR(eyeLandmarks) {
            const v1 = euclideanDistance(eyeLandmarks[1], eyeLandmarks[5]);
            const v2 = euclideanDistance(eyeLandmarks[2], eyeLandmarks[4]);
            const h = euclideanDistance(eyeLandmarks[0], eyeLandmarks[3]);
            return (v1 + v2) / (2.0 * h);
        }

        function onResults(results) {
            loadingOverlay.style.display = 'none';

            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // Halt processing if we are in the middle of capturing/analyzing
            if (isCapturing) {
                canvasCtx.restore();
                return;
            }

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#C0C0C040', lineWidth: 1});
                drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#FF3030'});
                drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#30FF30'});

                if (currentHandLandmarks) {
                    drawConnectors(canvasCtx, currentHandLandmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                    drawLandmarks(canvasCtx, currentHandLandmarks, {color: '#FF0000', lineWidth: 1, radius: 2});
                }

                // Head Stability Check
                const nosePos = landmarks[1]; 
                let isShaking = false;
                
                if (previousNosePos) {
                    const movement = euclideanDistance(nosePos, previousNosePos);
                    if (movement > SHAKE_THRESHOLD) {
                        isShaking = true;
                        isEyesClosed = false;
                        framesEyesClosed = 0;
                    }
                }
                previousNosePos = nosePos;

                // Liveness Sequence Logic
                if (!isLivenessVerified) {
                    const leftEyeIndices = [33, 160, 158, 133, 153, 144];
                    const rightEyeIndices = [362, 385, 387, 263, 373, 380];
                    const avgEAR = (calculateEAR(leftEyeIndices.map(i => landmarks[i])) + calculateEAR(rightEyeIndices.map(i => landmarks[i]))) / 2;

                    const mouthWidth = euclideanDistance(landmarks[61], landmarks[291]); 
                    const cheekWidth = euclideanDistance(landmarks[234], landmarks[454]); 
                    const smileRatio = mouthWidth / cheekWidth;

                    if (isShaking) {
                        livenessStatus.innerText = 'Keep phone/head stable!';
                        livenessStatus.classList.replace('text-yellow-400', 'text-red-500');
                    } else {
                        if (livenessStatus.innerText.includes('stable')) {
                             if(livenessStage === 'blink') livenessStatus.innerText = 'Waiting for Blink...';
                             else if(livenessStage === 'smile') livenessStatus.innerText = 'Now Smile!';
                             else if(livenessStage === 'hand') livenessStatus.innerText = 'Now Raise Hand ✋';
                             livenessStatus.classList.replace('text-red-500', 'text-yellow-400');
                        }
                        
                        if (livenessStage === 'blink') {
                            if (avgEAR < EAR_THRESHOLD) {
                                isEyesClosed = true;
                                framesEyesClosed++;
                            } else if (isEyesClosed && avgEAR > EAR_OPEN_THRESHOLD) {
                                if (framesEyesClosed >= MIN_FRAMES_CLOSED && framesEyesClosed <= MAX_FRAMES_CLOSED) {
                                    livenessStage = 'smile';
                                    livenessStatus.innerText = 'Blink Verified! Now Smile :)';
                                }
                                isEyesClosed = false;
                                framesEyesClosed = 0;
                            }
                        } 
                        else if (livenessStage === 'smile') {
                            if (smileRatio > SMILE_THRESHOLD) {
                                livenessStage = 'hand';
                                livenessStatus.innerText = 'Smile Verified! Now Raise Hand ✋';
                            }
                        }
                        else if (livenessStage === 'hand') {
                            if (currentHandLandmarks) {
                                isLivenessVerified = true;
                                livenessStage = 'verified';
                                livenessStatus.innerText = 'All Verified!';
                                livenessStatus.classList.remove('text-yellow-400', 'text-red-500', 'animate-pulse');
                                livenessStatus.classList.add('text-green-500');
                                cameraContainer.style.boxShadow = "0 0 40px rgba(34, 197, 94, 0.8)";
                                
                                // Trigger automatic capture with a slight delay so user sees success state
                                if (!isCapturing) {
                                    setTimeout(autoCapture, 600); 
                                }
                            }
                        }
                    }
                } // Ends liveness check block

                // Distance Logic
                const xCoordinates = landmarks.map(l => l.x);
                const faceWidth = Math.max(...xCoordinates) - Math.min(...xCoordinates);
                const estimatedDistanceCm = Math.round(FOCAL_FACTOR / faceWidth);
                distanceDisplay.innerText = `Distance: ~${estimatedDistanceCm} cm`;
                
                // Blocks capture if distance is 54 or lower
                if (estimatedDistanceCm < MIN_DISTANCE_CM) {
                    setUIState('red', `Move away (Min ${MIN_DISTANCE_CM}cm)`);
                } else {
                    let promptText = 'Distance perfect. Now Blink!';
                    if (livenessStage === 'smile') promptText = 'Blink verified! Now Smile!';
                    if (livenessStage === 'hand') promptText = 'Smile verified! Now Raise Hand ✋';
                    if (isLivenessVerified) promptText = 'Processing...';
                    setUIState('green', promptText);
                }

            } else {
                setUIState('red', 'Face not detected');
                distanceDisplay.innerText = 'Distance: -- cm';
            }
            
            canvasCtx.restore();
        }

        function setUIState(color, text) {
            feedbackBadge.innerText = text;
            if (color === 'green') {
                cameraContainer.classList.remove('border-red');
                cameraContainer.classList.add('border-green');
                feedbackBadge.classList.remove('bg-red-600');
                feedbackBadge.classList.add('bg-green-600');
                isDistanceOptimal = true;
            } else {
                cameraContainer.classList.remove('border-green');
                cameraContainer.classList.add('border-red');
                feedbackBadge.classList.remove('bg-green-600');
                feedbackBadge.classList.add('bg-red-600');
                isDistanceOptimal = false;
            }
        }

        const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults(onResults);

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                currentHandLandmarks = results.multiHandLandmarks[0];
            } else {
                currentHandLandmarks = null;
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { 
                await faceMesh.send({image: videoElement}); 
                if (livenessStage === 'hand' || livenessStage === 'verified') {
                    await hands.send({image: videoElement});
                } else {
                    currentHandLandmarks = null;
                }
            },
            width: 480, height: 640, facingMode: 'user'
        });
        camera.start();

        function resetCaptureState() {
            isCapturing = false;
            isLivenessVerified = false; 
            livenessStage = 'blink';
            currentHandLandmarks = null;
            livenessStatus.innerText = 'Waiting for Face...';
            livenessStatus.classList.remove('text-green-500');
            livenessStatus.classList.add('text-yellow-400', 'animate-pulse');
            document.getElementById('analyzing-overlay').classList.add('hidden');
            document.getElementById('success-popup').classList.add('hidden');
        }

        // Automatic Deep AI Verification using Google Apps Script Backend (Secure)
        function autoCapture() {
            if(isDistanceOptimal && isLivenessVerified && !isCapturing) {
                isCapturing = true;
                const imageData = canvasElement.toDataURL('image/jpeg', 0.9);
                
                document.getElementById('analyzing-overlay').classList.remove('hidden');
                feedbackBadge.innerText = "Please wait...";
                feedbackBadge.classList.replace('bg-green-600', 'bg-blue-600');

                const b64Data = imageData.split(',')[1];

                if (typeof google !== 'undefined' && google.script) {
                    google.script.run
                        .withSuccessHandler((aiAnalysis) => {
                            if (aiAnalysis.is_live) {
                                document.getElementById('analyzing-overlay').classList.add('hidden');
                                document.getElementById('success-popup').classList.remove('hidden');
                                // TODO: Call your actual attendance saving function here!
                                // The success popup will permanently block the screen indicating completion
                            } else {
                                document.getElementById('analyzing-overlay').classList.add('hidden');
                                feedbackBadge.innerText = `Spoof Detected: ${aiAnalysis.reason}`;
                                feedbackBadge.classList.replace('bg-blue-600', 'bg-red-600');
                                setTimeout(resetCaptureState, 5000);
                            }
                        })
                        .withFailureHandler((error) => {
                            document.getElementById('analyzing-overlay').classList.add('hidden');
                            feedbackBadge.innerText = "AI Verification Failed. Try Again.";
                            feedbackBadge.classList.replace('bg-blue-600', 'bg-red-600');
                            setTimeout(resetCaptureState, 4000);
                        })
                        .verifyLivenessWithGemini(b64Data);
                } else {
                    // Local testing fallback if running outside of Apps Script
                    setTimeout(() => {
                        document.getElementById('analyzing-overlay').classList.add('hidden');
                        document.getElementById('success-popup').classList.remove('hidden');
                    }, 2000);
                }
            }
        }

    </script>
</body>
</html>
