<body class="bg-surface-container-lowest text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Floating Physics Background -->
<div aria-hidden="true" class="pointer-events-none select-none fixed inset-0 overflow-hidden z-0" id="physics-icon-container"></div>
<!-- Main Container -->
<main class="w-full max-w-md mx-auto px-container-margin py-xl flex flex-col items-center text-center h-screen justify-between relative z-10">
<div class="flex flex-col items-center w-full mt-xl">
<!-- 3D Animation Container -->
<div class="w-[280px] h-[280px] mx-auto mb-lg relative rounded-full bg-surface-container-low flex items-center justify-center overflow-hidden shadow-sm">

<!-- Typography Content -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-md">
                All Set!

<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[300px]">
                Your Smart Finance account is ready. Let's start tracking your wealth with precision.
            </p>
</div>
<!-- Action Area -->
<div class="w-full pb-xl">
<button class="w-full h-12 rounded-[18px] btn-gradient text-on-primary font-label-md text-label-md shadow-[0px_20px_40px_rgba(123,77,255,0.15)] transition-transform active:scale-95 flex items-center justify-center gap-2">Click here to login <span class="material-symbols-outlined" style='font-variation-settings: "FILL" 0;'>arrow_forward</span></button>
</div>
</main>
<script>
(function() {
    const container = document.getElementById('physics-icon-container');
    if (!container) return;

    // Reduced to 1/3rd (5 curated financial items from original 16) for a sparse, elegant drifting backdrop
    const iconDefinitions = [
        { icon: 'currency_rupee', color: '#EAB308', size: 36, opacity: 0.16, name: 'Indian Rupee gold coin' },
        { icon: 'credit_card', color: '#7B4DFF', size: 38, opacity: 0.14, name: 'Credit card' },
        { icon: 'payments', color: '#10B981', size: 38, opacity: 0.14, name: 'Banknotes cash' },
        { icon: 'savings', color: '#EC4899', size: 38, opacity: 0.14, name: 'Piggy bank' },
        { icon: 'trending_up', color: '#059669', size: 40, opacity: 0.15, name: 'Trending growth chart' }
    ];

    let width = window.innerWidth;
    let height = window.innerHeight;

    const particles = [];

    iconDefinitions.forEach((def, index) => {
        const el = document.createElement('div');
        el.className = 'floating-icon-item';
        
        const span = document.createElement('span');
        span.className = 'material-symbols-outlined select-none';
        span.textContent = def.icon;
        span.style.fontSize = `${def.size}px`;
        span.style.color = def.color;
        span.style.opacity = def.opacity;
        
        el.appendChild(span);
        container.appendChild(el);

        const radius = def.size * 0.7;
        // Distribute positions across the screen
        const cols = 2;
        const rows = Math.ceil(iconDefinitions.length / cols);
        const col = index % cols;
        const row = Math.floor(index / cols);
        
        const cellW = width / cols;
        const cellH = height / rows;
        const x = col * cellW + Math.random() * (cellW - radius * 2) + radius;
        const y = row * cellH + Math.random() * (cellH - radius * 2) + radius;

        // Smooth slow drift velocities in all directions (positive and negative)
        const speed = 0.35 + Math.random() * 0.35;
        const angle = Math.random() * Math.PI * 2;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        let rot = Math.random() * 360;
        const vRot = (Math.random() - 0.5) * 0.2;

        particles.push({
            el,
            x,
            y,
            vx,
            vy,
            radius,
            rot,
            vRot,
            mass: radius
        });
    });

    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
    });

    function update() {
        // Move particles & wall reflection
        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vRot;

            // Reflect on boundaries (left, right, top, bottom)
            if (p.x - p.radius < 0) {
                p.x = p.radius;
                p.vx *= -1;
            } else if (p.x + p.radius > width) {
                p.x = width - p.radius;
                p.vx *= -1;
            }

            if (p.y - p.radius < 0) {
                p.y = p.radius;
                p.vy *= -1;
            } else if (p.y + p.radius > height) {
                p.y = height - p.radius;
                p.vy *= -1;
            }
        }

        // Particle-to-particle collision detection & reflection
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const p1 = particles[i];
                const p2 = particles[j];

                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const dist = Math.hypot(dx, dy);
                const minDist = p1.radius + p2.radius;

                if (dist < minDist && dist > 0) {
                    // Normal vector
                    const nx = dx / dist;
                    const ny = dy / dist;

                    // Separate to avoid overlap
                    const overlap = 0.5 * (minDist - dist);
                    p1.x -= nx * overlap;
                    p1.y -= ny * overlap;
                    p2.x += nx * overlap;
                    p2.y += ny * overlap;

                    // Relative velocity
                    const kx = p1.vx - p2.vx;
                    const ky = p1.vy - p2.vy;
                    const p = 2 * (nx * kx + ny * ky) / (p1.mass + p2.mass);

                    p1.vx -= p * p2.mass * nx;
                    p1.vy -= p * p2.mass * ny;
                    p2.vx += p * p1.mass * nx;
                    p2.vy += p * p1.mass * ny;
                }
            }
        }

        // Render positions smoothly
        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.el.style.transform = `translate3d(${p.x - p.radius}px, ${p.y - p.radius}px, 0) rotate(${p.rot}deg)`;
        }

        requestAnimationFrame(update);
    }

    requestAnimationFrame(update);
})();
</script>
