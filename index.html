<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liveness & Distance Capture</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe Face Detection Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

    <style>
        /* Smooth transition for the border color */
        #camera-container {
            transition: border-color 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        .border-red {
            border-color: #ef4444 !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
        .border-green {
            border-color: #22c55e !important;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }
        /* Mirror video for user-facing camera */
        #video-feed, #output-canvas {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full flex flex-col items-center">
        <h1 class="text-2xl font-bold mb-2 text-center">Face Verification</h1>
        <p class="text-gray-400 text-sm mb-6 text-center">Please position your face approx 50cm from the camera.</p>

        <!-- Camera Container -->
        <div id="camera-container" class="relative w-full aspect-[3/4] border-8 border-red rounded-2xl overflow-hidden bg-black flex items-center justify-center">
            
            <!-- Video element (hidden, used for mediapipe) -->
            <video id="video-feed" class="absolute w-full h-full object-cover hidden" playsinline autoplay></video>
            
            <!-- Canvas element (visible to user, where we draw) -->
            <canvas id="output-canvas" class="absolute w-full h-full object-cover"></canvas>

            <!-- Loading overlay -->
            <div id="loading" class="absolute z-10 flex flex-col items-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white mb-2"></div>
                <span>Loading Camera...</span>
            </div>

            <!-- Feedback Badge -->
            <div id="feedback-badge" class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-4 py-2 rounded-full font-bold text-sm shadow-lg whitespace-nowrap transition-colors duration-300">
                Face not detected
            </div>

            <!-- Real-time Distance Display -->
            <div id="distance-display" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-black/70 text-white px-3 py-1 rounded-md font-mono text-sm shadow-md border border-gray-600 backdrop-blur-sm">
                Distance: -- cm
            </div>
        </div>

        <!-- Capture Controls -->
        <div class="mt-8 w-full flex flex-col gap-4">
            <!-- Simulated Blink Liveness indicator -->
            <div class="flex items-center justify-between bg-gray-800 p-4 rounded-lg">
                <span class="text-sm font-semibold">Liveness (Blink)</span>
                <span id="liveness-status" class="text-yellow-400 text-sm font-bold">Pending...</span>
            </div>

            <!-- Capture Button -->
            <button id="capture-btn" disabled class="w-full bg-gray-600 text-white py-4 rounded-xl font-bold text-lg opacity-50 cursor-not-allowed transition-all duration-300">
                Capture Photo
            </button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video-feed');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const cameraContainer = document.getElementById('camera-container');
        const feedbackBadge = document.getElementById('feedback-badge');
        const distanceDisplay = document.getElementById('distance-display');
        const captureBtn = document.getElementById('capture-btn');
        const loadingOverlay = document.getElementById('loading');

        // --- DISTANCE CALIBRATION THRESHOLDS ---
        // These values represent the ratio of the face width to the total camera frame width.
        const MIN_FACE_WIDTH_RATIO = 0.25; // Less than this = Too far (> 60cm)
        const MAX_FACE_WIDTH_RATIO = 0.45; // More than this = Too close (< 40cm)

        // Magic number for calculating cm. 
        // Formula: Distance (cm) = FOCAL_FACTOR / FaceWidthRatio
        // Assuming ~50cm distance yields a ~0.35 face width: 50 * 0.35 = 17.5
        const FOCAL_FACTOR = 17.5; 

        let isDistanceOptimal = false;
        // Mock liveness for demonstration purposes. In your app, Arcface/Mediapipe handles this.
        let isLivenessVerified = true; 

        function onResults(results) {
            // Hide loading indicator once we get results
            loadingOverlay.style.display = 'none';

            // Match canvas dimensions to video
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.detections.length > 0) {
                // Get the first detected face
                const detection = results.detections[0];
                const boundingBox = detection.boundingBox;
                
                // Draw MediaPipe Face Box (Optional, you can remove this for a cleaner UI)
                drawRectangle(canvasCtx, boundingBox, {color: 'rgba(255, 255, 255, 0.5)', lineWidth: 2});

                // boundingBox.width is a normalized value between 0.0 and 1.0
                const faceWidth = boundingBox.width;
                
                // --- ESTIMATE DISTANCE IN CM ---
                const estimatedDistanceCm = Math.round(FOCAL_FACTOR / faceWidth);
                distanceDisplay.innerText = `Distance: ~${estimatedDistanceCm} cm`;
                
                // --- DISTANCE LOGIC ---
                if (faceWidth > MAX_FACE_WIDTH_RATIO) {
                    setUIState('red', 'Move away from camera');
                } else if (faceWidth < MIN_FACE_WIDTH_RATIO) {
                    setUIState('red', 'Move closer to camera');
                } else {
                    setUIState('green', 'Perfect distance!');
                }

            } else {
                setUIState('red', 'Face not detected');
                distanceDisplay.innerText = 'Distance: -- cm';
            }
            canvasCtx.restore();
        }

        function setUIState(color, text) {
            feedbackBadge.innerText = text;
            
            if (color === 'green') {
                cameraContainer.classList.remove('border-red');
                cameraContainer.classList.add('border-green');
                feedbackBadge.classList.remove('bg-red-600');
                feedbackBadge.classList.add('bg-green-600');
                
                isDistanceOptimal = true;
                
                // Enable button if both distance and liveness are good
                if (isLivenessVerified) {
                    captureBtn.disabled = false;
                    captureBtn.classList.remove('bg-gray-600', 'opacity-50', 'cursor-not-allowed');
                    captureBtn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'cursor-pointer');
                }
            } else {
                cameraContainer.classList.remove('border-green');
                cameraContainer.classList.add('border-red');
                feedbackBadge.classList.remove('bg-green-600');
                feedbackBadge.classList.add('bg-red-600');
                
                isDistanceOptimal = false;
                
                // Disable capture button
                captureBtn.disabled = true;
                captureBtn.classList.add('bg-gray-600', 'opacity-50', 'cursor-not-allowed');
                captureBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'cursor-pointer');
            }
        }

        // Initialize MediaPipe Face Detection
        const faceDetection = new FaceDetection({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`;
        }});

        faceDetection.setOptions({
            model: 'short', // 'short' is best for faces within 2 meters
            minDetectionConfidence: 0.7
        });
        
        faceDetection.onResults(onResults);

        // Start Camera
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceDetection.send({image: videoElement});
            },
            width: 480,
            height: 640,
            facingMode: 'user' // Force front camera
        });
        
        camera.start();

        // Capture Button Logic
        captureBtn.addEventListener('click', () => {
            if(isDistanceOptimal && isLivenessVerified) {
                // In your app, this is where you grab the image data and send it to Apps Script
                const imageData = canvasElement.toDataURL('image/jpeg', 0.9);
                feedbackBadge.innerText = "Photo Captured!";
                feedbackBadge.classList.replace('bg-green-600', 'bg-blue-600');
                // Disable temporarily
                captureBtn.disabled = true; 
                setTimeout(() => { captureBtn.disabled = false; }, 2000);
            }
        });

    </script>
</body>
</html>
