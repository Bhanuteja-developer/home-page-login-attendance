<style>
    body { font-family: 'Geist', sans-serif; background-color: #111318; min-height: max(884px, 100dvh); }
    .font-headline-sm, .font-headline-lg-mobile, .font-headline-lg, .font-headline-md, .font-display-lg { font-family: 'Space Grotesk', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    
    /* Neon Glow Effects */
    .neon-glow-primary { text-shadow: 0 0 10px rgba(165, 231, 255, 0.5); }
    .neon-glow-primary-btn { box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }
    .glass-panel { background: rgba(30, 32, 36, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(133, 147, 153, 0.2); }
  </style>

<body class="h-full flex flex-col items-center bg-background text-on-surface font-body-md pt-24 pb-lg">
<header class="fixed top-0 w-full z-50 flex flex-col justify-center items-center px-gutter h-16 bg-surface/80 backdrop-blur-md shadow-sm border-b border-outline-variant">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-[24px] neon-glow-primary" data-icon="fingerprint" data-weight="fill">fingerprint</span>
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight neon-glow-primary">WorkforceOS</span>
</div>
<span class="font-label-md text-xs text-outline tracking-widest uppercase mt-xs">SECURE ENTERPRISE ACCESS</span>
</header>
<main class="w-full max-w-md px-md flex-1 flex flex-col justify-center items-center">
<div class="w-full glass-panel rounded-[24px] shadow-2xl p-xl relative overflow-hidden shadow-[0_0_8px_rgba(0,210,255,0.8)] border-primary-container">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent"></div>
<form class="space-y-lg"><div class="mb-lg">
<h1 class="font-headline-sm text-headline-sm font-bold text-primary tracking-widest uppercase neon-glow-primary">Login</h1>
<div class="h-0.5 w-12 bg-primary-container mt-xs rounded-full shadow-[0_0_8px_rgba(0,210,255,0.8)]"></div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-xl pr-md py-sm border border-outline-variant rounded-lg bg-surface-container-lowest/50 text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all sm:text-sm font-body-md text-body-md" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-xl pr-md py-sm border border-outline-variant rounded-lg bg-surface-container-lowest/50 text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all sm:text-sm font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-sm flex items-center text-outline hover:text-primary-container transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-sm">
<div class="flex items-center">
<input class="h-4 w-4 text-primary-container focus:ring-primary-container border-outline-variant rounded bg-surface-container-lowest/50" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-sm block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors neon-glow-primary" href="#">
                            Forgot Password?
                        </a>
</div>
</div>
<button class="w-full flex justify-center items-center py-md px-md border border-transparent rounded-full font-label-md text-label-md text-on-primary-fixed bg-primary-container hover:bg-primary-fixed-dim focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background focus:ring-primary-container transition-all duration-200 active:scale-[0.98] uppercase tracking-wider group neon-glow-primary-btn" type="submit">
                    Login
                    <span class="material-symbols-outlined ml-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<div class="mt-lg pt-lg border-t border-outline-variant/50 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors ml-xs neon-glow-primary" href="#">Signup</a>
</p>
</div>
</div>
<div class="mt-lg text-center opacity-50">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">© 2024 WorkforceOS Inc.</p>
</div>
</main>
<script>
        document.querySelector('button[aria-label="Toggle password visibility"]').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('span');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    </script>


</body></html>
