<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

                        "surface-container-low": "#22191a",
                        "primary": "#ffb8c2",

                        "tertiary": "#7dde9f",

                        "error": "#ffb4ab",
                        "surface-bright": "#413638",
                        "surface-variant": "#3d3233",
                        "on-primary-container": "#782338",
                        "on-tertiary-container": "#004d29",
                        "inverse-surface": "#f0dedf",
                        "secondary-container": "#663a41",
                        "on-tertiary-fixed-variant": "#00522c",
                        "primary-fixed": "#ffd9dd",
                        "on-secondary-fixed": "#331017",

<style>
        body {
            /* Deep oceanic gradient background */
            background: linear-gradient(135deg, #0d1b2a, #1b263b, #415a77, #1a1112);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            backdrop-filter: blur(24px);
            background-color: rgba(26, 17, 18, 0.4);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25), 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .glass-input {
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: #ff8da1;
            box-shadow: 0 0 15px rgba(255, 141, 161, 0.3);
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Modal slide up animation */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-slide-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Radial Progress Chart */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.8s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface min-h-screen flex items-end md:items-center justify-center p-0 md:p-container-padding overflow-hidden">
<!-- Modal Container -->
<div class="modal-slide-up glass-panel w-full md:max-w-md h-[795px] md:h-auto md:max-h-[751px] rounded-t-[32px] md:rounded-[32px] flex flex-col relative z-10 overflow-y-auto">
<!-- Handle for mobile -->
<div class="w-full flex justify-center py-4 md:hidden sticky top-0 z-20">
<div class="w-12 h-1.5 bg-on-surface-variant/40 rounded-full"></div>
</div>
<!-- Header Actions -->
<div class="flex justify-between items-center px-container-padding pt-4 md:pt-container-padding pb-2 sticky top-0 z-10">
<button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_horiz</span>
</button>
</div>
<div class="flex-1 px-container-padding pb-container-padding flex flex-col items-center">
<!-- Massive Top Icon -->
<div class="w-20 h-20 rounded-full bg-surface-container-high/50 flex items-center justify-center mb-6 shadow-[inset_0_4px_10px_rgba(0,0,0,0.3)] border border-white/5">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">self_improvement</span>
</div>
<!-- Habit Title & Category -->
<h1 class="font-headline-md text-headline-md mb-2 text-center text-on-surface">Morning Meditation</h1>
<div class="glass-panel px-4 py-1.5 rounded-full mb-8">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Mindfulness</span>
</div>
<!-- Radial Progress Chart (Streak) -->
<div class="relative w-48 h-48 mb-10 flex items-center justify-center">
<svg class="w-full h-full absolute inset-0" viewbox="0 0 120 120">
<circle class="text-surface-container-highest stroke-current" cx="60" cy="60" fill="transparent" r="54" stroke-width="6"></circle>
<!-- Dasharray: 2 * PI * r = ~339.29, Dashoffset: 339.29 * (1 - progress/total) -->
<circle class="text-primary-container stroke-current progress-ring__circle" cx="60" cy="60" fill="transparent" r="54" stroke-dasharray="339.29" stroke-dashoffset="100" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<div class="flex flex-col items-center justify-center z-10">
<span class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-1">14</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Day Streak</span>
</div>
<!-- Sparkle accents for organic feel -->
<span class="material-symbols-outlined text-tertiary-container absolute -top-2 right-4 text-sm animate-pulse">arrow_back_ios_new</span>
<span class="material-symbols-outlined text-secondary absolute bottom-4 -left-2 text-xs animate-bounce" style="animation-duration: 3s;">arrow_back_ios_new</span>
</div>
<!-- Journal Area -->
<div class="w-full flex flex-col gap-3 mb-8">
<label class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-sm">edit_note</span>
                    Reflection
                </label>
<textarea class="glass-input w-full h-[150px] rounded-[24px] p-5 font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/50 resize-none" placeholder="How did this feel today?"></textarea>
</div>
<!-- Save Button -->
<button class="w-full bg-[#FF8DA1] hover:bg-[#ffb8c2] text-[#400013] font-body-lg text-body-lg font-semibold py-4 rounded-[24px] transition-all duration-300 shadow-[0_4px_14px_rgba(255,141,161,0.3)] hover:shadow-[0_6px_20px_rgba(255,141,161,0.5)] transform hover:-translate-y-1 mt-auto flex items-center justify-center gap-2">
<span>Save Reflection</span>
<span class="material-symbols-outlined text-xl">check_circle</span>
</button>
</div>
</div>
</body></html>
