<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .marker-pulse {
            position: relative;
        }
        .marker-pulse::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0, 94, 184, 0.4);
            animation: pulse 2s infinite;
            z-index: -1;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }
        #map { height: 100vh; width: 100%; z-index: 0; }
        .bottom-sheet {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bottom-sheet.collapsed {
            transform: translateY(calc(100% - 120px));
        }
    </style>

<!-- Leaflet JS -->
<script crossorigin="" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
        // Initialize Map
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([12.9716, 77.5946], 15); // Centered on Bangalore as a high-tech hub example

        // Enterprise Style (CartoDB Positron - clean and professional)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 20
        }).addTo(map);

        // Geofence Circle
        const officeCoords = [12.9750, 77.5980];
        L.circle(officeCoords, {
            color: '#005eb8',
            fillColor: '#005eb8',
            fillOpacity: 0.1,
            radius: 300,
            weight: 1
        }).addTo(map);

        // Office Marker
        const officeIcon = L.divIcon({
            html: `
                <div class="bg-white p-2 rounded-xl shadow-lg border-2 border-primary flex items-center justify-center">
                    <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">corporate_fare</span>
                </div>
            `,
            className: 'custom-div-icon',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });
        L.marker(officeCoords, { icon: officeIcon }).addTo(map);

        // Employee Marker
        const employeeCoords = [12.9700, 77.5930];
        const employeeIcon = L.divIcon({
            html: `
                <div class="marker-pulse w-10 h-10 rounded-full border-2 border-white shadow-lg overflow-hidden bg-primary">
                    <img src="placeholder" data-alt="Avatar icon of Bhanu on the map, visible as a small circular profile picture with high clarity." class="w-full h-full object-cover">
                </div>
            `,
            className: 'custom-div-icon',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });
        const employeeMarker = L.marker(employeeCoords, { icon: employeeIcon }).addTo(map);

        // Fit bounds to show both
        const bounds = L.latLngBounds([officeCoords, employeeCoords]);
        map.fitBounds(bounds, { padding: [100, 100] });

        // Bottom Sheet Logic
        function toggleSheet() {
            const sheet = document.getElementById('bottomSheet');
            sheet.classList.toggle('collapsed');
        }

        // Micro-interaction: Randomly move employee marker slightly to simulate "Live"
        setInterval(() => {
            const currentLat = employeeMarker.getLatLng().lat;
            const currentLng = employeeMarker.getLatLng().lng;
            employeeMarker.setLatLng([
                currentLat + (Math.random() - 0.5) * 0.0001,
                currentLng + (Math.random() - 0.5) * 0.0001
            ]);
        }, 3000);
    </script>
