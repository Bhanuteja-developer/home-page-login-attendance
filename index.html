<body class="bg-white text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-container-margin relative overflow-hidden" style="background-color: rgb(255, 255, 255);">
<!-- Floating Physics Background -->
<div aria-hidden="true" class="pointer-events-none select-none fixed inset-0 overflow-hidden z-0" id="physics-icon-container"></div>
<main class="w-full max-w-[480px] flex flex-col gap-lg z-10">
<!-- Header -->
<header class="text-center flex flex-col gap-sm">
<div class="mx-auto w-16 h-16 rounded-full bg-primary-container/20 flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-primary text-4xl" data-weight="fill" style='font-variation-settings: "FILL" 1;'>mail</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Verify Email</h1>
<p class="font-body-md text-body-md text-on-surface-variant">We've sent a 6-digit verification code to<br/><span class="font-label-md text-label-md text-primary mt-xs block">alex.rivers@example.com</span></p>
</header>
<!-- Form -->
<form class="flex flex-col gap-md w-full" id="verificationForm">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="temp-password">Verification Code</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">key</span>
<input class="w-full h-[56px] pl-[48px] pr-4 rounded-lg bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline" id="temp-password" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit code" required="" type="text"/>
</div>
</div>
<button class="w-full h-[48px] rounded-[18px] btn-primary-gradient text-on-primary font-label-md text-label-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit"><span class="">Verify It's You</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button>
</form>
<!-- Footer Actions -->
<div class="flex flex-col items-center gap-sm mt-sm">
<p class="font-body-md text-body-md text-on-surface-variant text-center">
                Didn't receive the email?
            </p>
<button class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors bg-transparent border-none cursor-pointer flex items-center gap-xs" id="resendBtn" type="button">
<span class="material-symbols-outlined text-[18px]">refresh</span>
                Resend Code
            </button>
</div>
</main>
<script>
        document.getElementById('verificationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Basic validation simulation
            const temp = document.getElementById('temp-password').value;
            if(!temp) return;
            
            // Add a subtle success state class
            const btn = this.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Verified</span>';
            btn.classList.replace('btn-primary-gradient', 'bg-tertiary');
            
            setTimeout(() => {
                alert("Verification successful. Redirecting to dashboard...");
            }, 600);
        });

        document.getElementById('resendBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const btn = this;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">refresh</span> Sending...';
            btn.style.pointerEvents = 'none';
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span> Sent!';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.pointerEvents = 'auto';
                }, 2000);
            }, 1500);
        });
    </script>
<script>
(function() {
    const container = document.getElementById('physics-icon-container');
    if (!container) return;

    // Financial icons definition: Rupee gold coin, credit card, ATM card, banknotes/cash, gold biscuit bar, piggy bank, pie chart, trending growth chart
    const iconDefinitions = [
        { icon: 'currency_rupee', color: '#EAB308', size: 36, opacity: 0.16, name: 'Indian Rupee gold coin' },
        { icon: 'credit_card', color: '#7B4DFF', size: 38, opacity: 0.14, name: 'Credit card' },
        { icon: 'local_atm', color: '#FF6B3D', size: 36, opacity: 0.13, name: 'ATM card / kiosk' },
        { icon: 'payments', color: '#10B981', size: 38, opacity: 0.14, name: 'Banknotes cash' },
        { icon: 'view_in_ar', color: '#F59E0B', size: 34, opacity: 0.15, name: 'Gold biscuit bar' },
        { icon: 'savings', color: '#EC4899', size: 38, opacity: 0.14, name: 'Piggy bank' },
        { icon: 'pie_chart', color: '#6366F1', size: 36, opacity: 0.13, name: 'Pie chart' },
        { icon: 'trending_up', color: '#059669', size: 40, opacity: 0.15, name: 'Trending growth chart' },
        { icon: 'currency_rupee', color: '#D97706', size: 42, opacity: 0.15, name: 'Gold rupee' },
        { icon: 'account_balance', color: '#7B4DFF', size: 36, opacity: 0.12, name: 'Bank institution' },
        { icon: 'toll', color: '#FBBF24', size: 32, opacity: 0.14, name: 'Gold medal / coin' },
        { icon: 'analytics', color: '#8B5CF6', size: 34, opacity: 0.13, name: 'Market analytics' },
        { icon: 'payments', color: '#FF6B3D', size: 34, opacity: 0.13, name: 'Cash bills' },
        { icon: 'savings', color: '#7B4DFF', size: 36, opacity: 0.13, name: 'Piggy savings' },
        { icon: 'credit_card', color: '#3B82F6', size: 34, opacity: 0.12, name: 'Digital card' },
        { icon: 'trending_up', color: '#10B981', size: 36, opacity: 0.14, name: 'Growth curve' }
    ];

    let width = window.innerWidth;
    let height = window.innerHeight;

    const particles = [];

    iconDefinitions.forEach((def, index) => {
        const el = document.createElement('div');
        el.className = 'floating-icon-item';
        
        const span = document.createElement('span');
        span.className = 'material-symbols-outlined select-none';
        span.textContent = def.icon;
        span.style.fontSize = `${def.size}px`;
        span.style.color = def.color;
        span.style.opacity = def.opacity;
        
        el.appendChild(span);
        container.appendChild(el);

        const radius = def.size * 0.7;
        // Distribute positions across the screen
        const cols = 4;
        const rows = Math.ceil(iconDefinitions.length / cols);
        const col = index % cols;
        const row = Math.floor(index / cols);
        
        const cellW = width / cols;
        const cellH = height / rows;
        const x = col * cellW + Math.random() * (cellW - radius * 2) + radius;
        const y = row * cellH + Math.random() * (cellH - radius * 2) + radius;

        // Smooth slow drift velocities in all directions (positive and negative)
        const speed = 0.35 + Math.random() * 0.35;
        const angle = Math.random() * Math.PI * 2;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        let rot = Math.random() * 360;
        const vRot = (Math.random() - 0.5) * 0.2;

        particles.push({
            el,
            x,
            y,
            vx,
            vy,
            radius,
            rot,
            vRot,
            mass: radius
        });
    });

    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
    });

    function update() {
        // Move particles & wall reflection
        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vRot;

            // Reflect on boundaries (left, right, top, bottom)
            if (p.x - p.radius < 0) {
                p.x = p.radius;
                p.vx *= -1;
            } else if (p.x + p.radius > width) {
                p.x = width - p.radius;
                p.vx *= -1;
            }

            if (p.y - p.radius < 0) {
                p.y = p.radius;
                p.vy *= -1;
            } else if (p.y + p.radius > height) {
                p.y = height - p.radius;
                p.vy *= -1;
            }
        }

        // Particle-to-particle collision detection & reflection
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const p1 = particles[i];
                const p2 = particles[j];

                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const dist = Math.hypot(dx, dy);
                const minDist = p1.radius + p2.radius;

                if (dist < minDist && dist > 0) {
                    // Normal vector
                    const nx = dx / dist;
                    const ny = dy / dist;

                    // Separate to avoid overlap
                    const overlap = 0.5 * (minDist - dist);
                    p1.x -= nx * overlap;
                    p1.y -= ny * overlap;
                    p2.x += nx * overlap;
                    p2.y += ny * overlap;

                    // Relative velocity
                    const kx = p1.vx - p2.vx;
                    const ky = p1.vy - p2.vy;
                    const p = 2 * (nx * kx + ny * ky) / (p1.mass + p2.mass);

                    p1.vx -= p * p2.mass * nx;
                    p1.vy -= p * p2.mass * ny;
                    p2.vx += p * p1.mass * nx;
                    p2.vy += p * p1.mass * ny;
                }
            }
        }

        // Render positions smoothly
        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.el.style.transform = `translate3d(${p.x - p.radius}px, ${p.y - p.radius}px, 0) rotate(${p.rot}deg)`;
        }

        requestAnimationFrame(update);
    }

    requestAnimationFrame(update);
})();
</script>
