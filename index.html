<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PM Report - Division &amp; User</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "bg-gradient-end": "#d6e0f0",
                        "inverse-on-surface": "#ecf1ff",
                        "on-tertiary-fixed-variant": "#41474e",
                        "surface-container-high": "#dee8ff",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#cfdaf2",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f0f3ff",
                        "secondary-fixed-dim": "#bec6e0",
                        "success": "#10b981",
                        "on-secondary-container": "#5c647a",
                        "glass-surface": "rgba(255, 255, 255, 0.65)",
                        "background": "#f9f9ff",
                        "surface-container-highest": "#d8e3fb",
                        "on-primary": "#ffffff",
                        "error": "#f43f5e",
                        "on-background": "#111c2d",
                        "surface": "#f9f9ff",
                        "surface-bright": "#f9f9ff",
                        "on-tertiary-container": "#2d3339",
                        "on-secondary-fixed-variant": "#3f465c",
                        "surface-tint": "#9d4300",
                        "on-error": "#ffffff",
                        "secondary": "#565e74",
                        "glass-border": "rgba(255, 255, 255, 0.8)",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#e0c0b1",
                        "primary-container": "#f97316",
                        "on-surface-variant": "#584237",
                        "on-surface": "#111c2d",
                        "inverse-surface": "#263143",
                        "secondary-fixed": "#dae2fd",
                        "tertiary-fixed-dim": "#c1c7cf",
                        "primary-fixed-dim": "#ffb690",
                        "tertiary-fixed": "#dde3eb",
                        "surface-container": "#e7eeff",
                        "bg-gradient-start": "#e6eaf3",
                        "primary-fixed": "#ffdbca",
                        "outline": "#8c7164",
                        "on-tertiary-fixed": "#161c22",
                        "slate-muted": "#64748b",
                        "on-primary-fixed-variant": "#783200",
                        "on-primary-container": "#582200",
                        "on-secondary-fixed": "#131b2e",
                        "tertiary": "#595f66",
                        "surface-variant": "#d8e3fb",
                        "inverse-primary": "#ffb690",
                        "secondary-container": "#dae2fd",
                        "warning": "#f59e0b",
                        "primary": "#9d4300",
                        "tertiary-container": "#959ba2",
                        "on-primary-fixed": "#341100"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "xs": "4px",
                        "base": "4px",
                        "card-padding": "2rem",
                        "lg": "24px",
                        "md": "16px",
                        "gutter": "1.5rem",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "section-header": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "helper-text": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "input-text": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "section-header": ["17.6px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "helper-text": ["12px", { "lineHeight": "16.8px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "input-text": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background: linear-gradient(135deg, var(--tw-colors-bg-gradient-start) 0%, var(--tw-colors-bg-gradient-end) 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background font-body-lg antialiased pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-glass-surface dark:bg-inverse-surface backdrop-blur-md border-b border-glass-border dark:border-outline-variant shadow-sm flex justify-between items-center px-lg h-16 w-full">
<div class="flex items-center gap-md">
<div class="h-8 w-8 rounded-full bg-primary-container/20 flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-primary font-headline-md text-headline-md" data-icon="person">person</span>
</div>
<h1 class="font-headline-md text-headline-md font-extrabold text-primary dark:text-primary-fixed-dim">PM Report</h1>
</div>
<button class="hover:bg-primary-container/10 transition-colors active:scale-95 duration-150 p-2 rounded-full">
<span class="material-symbols-outlined text-secondary dark:text-secondary-fixed-dim" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content -->
<main class="pt-24 px-lg max-w-2xl mx-auto pb-safe">
<!-- Progress Stepper -->
<div class="mb-lg">
<div class="flex justify-between items-center mb-sm">
<span class="font-section-header text-section-header text-on-surface">Division &amp; User</span>
<span class="font-helper-text text-helper-text text-secondary">Step 1 of 6</span>
</div>
<div class="flex items-center gap-xs">
<div class="h-2 flex-1 rounded-full bg-primary relative overflow-hidden">
<div class="absolute inset-0 bg-white/20"></div>
</div>
<div class="h-2 flex-1 rounded-full bg-secondary-fixed-dim/50"></div>
<div class="h-2 flex-1 rounded-full bg-secondary-fixed-dim/50"></div>
<div class="h-2 flex-1 rounded-full bg-secondary-fixed-dim/50"></div>
<div class="h-2 flex-1 rounded-full bg-secondary-fixed-dim/50"></div>
<div class="h-2 flex-1 rounded-full bg-secondary-fixed-dim/50"></div>
</div>
</div>
<!-- Form Glass Card -->
<div class="glass-card rounded-xl p-md shadow-sm mb-xl">
<form class="space-y-md">
<!-- Division No -->
<div>
<label class="block font-label-caps text-label-caps text-secondary mb-xs">Division No</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-input-text text-input-text text-on-surface focus:ring-2 focus:ring-primary focus:border-primary appearance-none outline-none">
<option value="">Select Division</option>
<option value="div-01">DIV-01 North</option>
<option value="div-02">DIV-02 South</option>
<option value="div-03">DIV-03 East</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-sm text-secondary">
<span class="material-symbols-outlined" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
<!-- User Name -->
<div>
<label class="block font-label-caps text-label-caps text-secondary mb-xs">User Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-input-text text-input-text text-on-surface placeholder:text-slate-muted focus:ring-2 focus:ring-primary focus:border-primary outline-none" placeholder="Enter full name" type="text"/>
</div>
<!-- Designation -->
<div>
<label class="block font-label-caps text-label-caps text-secondary mb-xs">Designation</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-input-text text-input-text text-on-surface placeholder:text-slate-muted focus:ring-2 focus:ring-primary focus:border-primary outline-none" placeholder="e.g. Field Engineer" type="text"/>
</div>
<!-- Phone No -->
<div>
<label class="block font-label-caps text-label-caps text-secondary mb-xs">Phone No</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-input-text text-input-text text-on-surface placeholder:text-slate-muted focus:ring-2 focus:ring-primary focus:border-primary outline-none" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<!-- Location -->
<div>
<label class="block font-label-caps text-label-caps text-secondary mb-xs">Location</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-xl pr-md py-sm font-input-text text-input-text text-on-surface placeholder:text-slate-muted focus:ring-2 focus:ring-primary focus:border-primary outline-none" placeholder="Current location" type="text"/>
<div class="absolute inset-y-0 left-0 flex items-center pl-sm">
<span class="material-symbols-outlined text-secondary" data-icon="location_on">location_on</span>
</div>
</div>
</div>
</form>
</div>
</main>
<!-- Bottom Action Bar (Transactional Flow -> Suppress BottomNavBar, use custom action bar) -->
<div class="fixed bottom-0 w-full z-40 bg-glass-surface backdrop-blur-md border-t border-glass-border px-lg py-md pb-safe">
<button class="w-full bg-primary text-on-primary font-section-header text-section-header py-sm rounded-lg shadow-[0_4px_12px_rgba(249,115,22,0.25)] hover:bg-surface-tint active:scale-95 transition-all flex items-center justify-center gap-xs">
            Next Step
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</body></html>
